services:
  vllm:
    image: ${VLLM_IMAGE}
    container_name: echo-numarkdown-ocr-vllm
    restart: "no"
    runtime: nvidia
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - 127.0.0.1:8000:8000
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ../cache/huggingface:/root/.cache/huggingface
      - ../cache/vllm:/root/.cache/vllm
      - ../cache/flashinfer:/root/.cache/flashinfer
      - ../cache/triton:/root/.triton
    command:
      - /bin/bash
      - -lc
      - >-
        exec vllm serve numind/NuMarkdown-8B-Thinking
        --revision 8dfc5236ae68b799d86308aae2f9717fdb50286e
        --served-model-name numind/NuMarkdown-8B-Thinking
        --trust-remote-code
        --host 0.0.0.0
        --port 8000
        --dtype bfloat16
        --max-model-len 16384
        --gpu-memory-utilization 0.7
        --max-num-seqs 1
        --limit-mm-per-prompt '{"image":1,"video":0}'
        --chat-template-content-format openai
        --generation-config vllm
        --enforce-eager
    healthcheck:
      test: [CMD-SHELL, curl -fsS http://127.0.0.1:8000/health]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 10m
