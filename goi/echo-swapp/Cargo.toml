[package]
name = "echo-swapp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Swapp-compatible GOI messenger API wrapper"

[dependencies]
actix-web = { workspace = true }
anyhow = { workspace = true }
base64 = "0.22.1"
chrono = { workspace = true }
env_logger = "0.11.9"
log = { workspace = true }
regex = "1.12.3"
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }
toml = "0.9.12"

[dependencies.echo-im]
git = "ssh://git@github.com/echoua/echo-im.git"
rev = "d25a29378e61d97a19768101459ce9b9ae335c41"

[package.metadata.deb]
maintainer-scripts = "debian/"
systemd-units = [{ unit-name = "echo-swapp" }]
depends = ""
assets = [
    ["target/release/echo-swapp", "usr/bin/", "755"],
    ["config.toml.example", "etc/echo-swapp/config.toml.example", "644"],
    ["deploy/systemd/echo-signal-bot@.service", "usr/lib/systemd/system/", "644"],
    ["deploy/systemd/echo-whatsapp-bot@.service", "usr/lib/systemd/system/", "644"],
]
