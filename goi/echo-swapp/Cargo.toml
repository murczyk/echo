[package]
name = "echo-swapp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Swapp-compatible GOI messenger API wrapper"

[dependencies]
actix-web = { workspace = true }
anyhow = { workspace = true }
base64 = "0.22.1"
chrono = { workspace = true }
echo-install-utils = { git = "ssh://git@github.com/echoua/echo-install-utils.git", rev = "c9efd65ccf72bf447867e5f959eec7779771007e" }
env_logger = "0.11.9"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
log = { workspace = true }
milgeo-rs = { git = "ssh://git@github.com/echoua/milgeo-rs.git", rev = "a94bda974c1af3f31362c10965dda066c602cf30" }
regex = "1.12.3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }
toml = "0.9.12"

[dependencies.echo-im]
git = "ssh://git@github.com/echoua/echo-im.git"
rev = "f2a5090cdb7b6ac072ddc98b32eeb1d4ed7f8c75"

[package.metadata.deb]
maintainer-scripts = "debian/"
systemd-units = [{ unit-name = "echo-swapp" }]
depends = ""
assets = [
    ["target/release/echo-swapp", "usr/bin/", "755"],
    ["config.toml.example", "etc/echo-swapp/config.toml.example", "644"],
    ["deploy/systemd/echo-signal-bot@.service", "usr/lib/systemd/system/", "644"],
    ["deploy/systemd/echo-whatsapp-bot@.service", "usr/lib/systemd/system/", "644"],
]
