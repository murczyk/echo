[package]
name = "echo-iggy"
version = "1.0.1"
edition = "2021"
authors = ["rickyrepel@gmail.com"]
license = "AllRightsReserved"
description = "ЕХО - Apache Iggy deb"
autobins = false

[lib]
path = "src/lib.rs"

[package.metadata.deb]
maintainer = "rickyrepel@gmail.com"
priority = "optional"
section = "utils"
depends = "$auto, python3, python3-toml"
maintainer-scripts = "debian/"
systemd-units = [{ unit-name = "echo-iggy" }]
# This tells cargo-deb exactly where to pull your existing files
# and where they should land on the target Debian system.
assets = [
    ["deploy/iggy-server", "usr/local/bin/iggy-server", "755"],
    ["deploy/storage_policy.py", "usr/local/lib/echo-iggy/storage_policy.py", "644"],
    ["debian/echo-iggy-storage-policy.service", "lib/systemd/system/echo-iggy-storage-policy.service", "644"],
    ["debian/echo-iggy-storage-policy.timer", "lib/systemd/system/echo-iggy-storage-policy.timer", "644"],
    # ["deploy/config.toml", "etc/iggy/config.toml", "644"],
]
