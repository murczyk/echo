name: CI Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean_cache:
        description: "Clean Python dependency cache"
        required: false
        default: false
        type: boolean

jobs:
  frontend-tests:
    if: github.repository == 'echoua/echo'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
        with:
          path: frontend-workspace

      - name: Setup cache
        working-directory: frontend-workspace
        run: just ci-setup-cache

      - name: Run frontend tests
        working-directory: frontend-workspace
        run: just test-fe

      - name: Save cache
        working-directory: frontend-workspace
        run: just ci-save-cache

      - name: Cleanup workspace
        if: always()
        run: rm -rf frontend-workspace

  backend-tests:
    if: github.repository == 'echoua/echo'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
        with:
          path: backend-workspace

      - name: Setup cache
        working-directory: backend-workspace
        run: |
          if [ "${{ github.event.inputs.clean_cache }}" = "true" ]; then
            just ci-setup-cache clean
          else
            just ci-setup-cache
          fi

      - name: Run backend tests
        working-directory: backend-workspace
        env:
          GITHUB_ACTIONS: true
        run: just ci-test-be

      - name: Save cache
        working-directory: backend-workspace
        run: |
          if [ "${{ github.event.inputs.clean_cache }}" = "true" ]; then
            just ci-save-cache clean
          else
            just ci-save-cache
          fi

      - name: Cleanup workspace
        if: always()
        run: rm -rf backend-workspace
