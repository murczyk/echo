name: CI Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean_cache:
        description: "Clean Python dependency cache"
        required: false
        default: false
        type: boolean
      cache_strategy:
        description: "Cache strategy to use"
        required: false
        default: "optimized"
        type: choice
        options:
          - "standard"
          - "optimized"
          - "sccache"

jobs:
  frontend-tests:
    if: github.repository == 'echoua/echo'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Setup cache
        run: just ci-setup-cache-frontend

      - name: Run frontend tests
        run: just test-fe

      - name: Save cache
        run: just ci-save-cache-frontend

  backend-tests:
    if: github.repository == 'echoua/echo'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Setup cache
        run: |
          CACHE_STRATEGY="${{ github.event.inputs.cache_strategy || 'optimized' }}"
          CLEAN_FLAG=""
          if [ "${{ github.event.inputs.clean_cache }}" = "true" ]; then
            CLEAN_FLAG="clean"
          fi

          case "$CACHE_STRATEGY" in
            "standard")
              just ci-setup-cache $CLEAN_FLAG
              ;;
            "optimized")
              just ci-setup-cache-optimized $CLEAN_FLAG
              ;;
            "sccache")
              just ci-setup-cache-sccache $CLEAN_FLAG
              ;;
            *)
              echo "Unknown cache strategy: $CACHE_STRATEGY, using optimized"
              just ci-setup-cache-optimized $CLEAN_FLAG
              ;;
          esac

      - name: Run backend tests
        env:
          GITHUB_ACTIONS: true
        run: just ci-test-be

      - name: Save cache
        run: |
          CACHE_STRATEGY="${{ github.event.inputs.cache_strategy || 'optimized' }}"
          CLEAN_FLAG=""
          if [ "${{ github.event.inputs.clean_cache }}" = "true" ]; then
            CLEAN_FLAG="clean"
          fi

          case "$CACHE_STRATEGY" in
            "standard")
              just ci-save-cache $CLEAN_FLAG
              ;;
            "optimized")
              just ci-save-cache-optimized $CLEAN_FLAG
              ;;
            "sccache")
              just ci-save-cache-sccache $CLEAN_FLAG
              ;;
            *)
              echo "Unknown cache strategy: $CACHE_STRATEGY, using optimized"
              just ci-save-cache-optimized $CLEAN_FLAG
              ;;
          esac
