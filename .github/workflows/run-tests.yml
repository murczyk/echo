name: CI Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean_cache:
        description: "Clean Python dependency cache"
        required: false
        default: false
        type: boolean

jobs:
  frontend-tests:
    if: github.repository == 'echoua/echo'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: wdintel-web/node_modules
          key: npm-deps-${{ hashFiles('wdintel-web/package-lock.json') }}
          restore-keys: |
            npm-deps-

      - name: Run frontend tests
        run: just test-fe

  backend-tests:
    if: github.repository == 'echoua/echo'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Generate cache key
        id: cache-key
        run: |
          if [ "${{ github.event.inputs.clean_cache }}" = "true" ]; then
            echo "key=python-deps-clean-$(date +%s)" >> $GITHUB_OUTPUT
          else
            echo "key=python-deps-$(sha256sum wdintel-rs/wdintel-py/requirements.txt | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          fi

      - name: Cache Python virtual environment
        uses: actions/cache@v3
        with:
          path: wdintel-rs/wdintel-py/.venv
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            python-deps-

      - name: Cache spacy model
        uses: actions/cache@v3
        with:
          path: ~/.cache/spacy
          key: spacy-model-ru_core_news_md-v1
          restore-keys: |
            spacy-model-

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            wdintel-rs/target/
          key: rust-deps-${{ hashFiles('wdintel-rs/Cargo.lock') }}
          restore-keys: |
            rust-deps-

      - name: Run backend tests
        env:
          GITHUB_ACTIONS: true
        run: just test-be
