name: CI Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-tests:
    if: github.repository == 'echoua/echo'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true

      - name: Setup Git LFS and debug
        run: |
          echo "Checking Git LFS status..."
          git lfs install
          git lfs pull
          echo "Checking LFS file: deploy/wd_test-2025-08-17-07-43.pgrestore"
          ls -la deploy/wd_test-2025-08-17-07-43.pgrestore
          file deploy/wd_test-2025-08-17-07-43.pgrestore
          echo "First 50 bytes:"
          head -c 50 deploy/wd_test-2025-08-17-07-43.pgrestore | hexdump -C

      - name: Restore npm cache
        run: ./scripts/cache/restore-npm.sh || true

      - name: Run frontend tests
        run: just test-fe

      - name: Save npm cache
        if: always()
        run: ./scripts/cache/save-npm.sh

      - name: Discord notification - Frontend tests
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_CI }}
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            ./scripts/notifications/discord-notify.sh ci_failure "" "Frontend Tests Failed" "Frontend tests encountered failures"
          fi

  backend-tests:
    if: github.repository == 'echoua/echo'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true

      - name: Setup Git LFS and debug
        run: |
          echo "Checking Git LFS status..."
          git lfs install
          git lfs pull
          echo "Checking LFS file: deploy/wd_test-2025-08-17-07-43.pgrestore"
          ls -la deploy/wd_test-2025-08-17-07-43.pgrestore
          file deploy/wd_test-2025-08-17-07-43.pgrestore
          echo "First 50 bytes:"
          head -c 50 deploy/wd_test-2025-08-17-07-43.pgrestore | hexdump -C

      - name: Restore Python cache
        run: ./scripts/cache/restore-python.sh || true

      - name: Restore Spacy cache
        run: ./scripts/cache/restore-spacy.sh || true

      - name: Run backend tests
        env:
          GITHUB_ACTIONS: true
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: just ci-test-be

      - name: Save Python cache
        if: always()
        run: ./scripts/cache/save-python.sh

      - name: Save Spacy cache
        if: always()
        run: ./scripts/cache/save-spacy.sh

      - name: Discord notification - Backend tests
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_CI }}
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            ./scripts/notifications/discord-notify.sh ci_failure "" "Backend Tests Failed" "Backend tests encountered failures"
          fi

  notify-completion:
    # Disabled: previously sent overall CI failure Discord notification ("💥 CI Tests Failed").
    # Intentionally left as a no-op job to preserve workflow structure if referenced elsewhere.
    if: false
    needs: [frontend-tests, backend-tests]
    runs-on: self-hosted
    steps:
      - name: Skip overall CI failure notification
        run: echo "Overall CI failure Discord notification disabled."
