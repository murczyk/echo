name: CI Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-tests:
    if: github.repository == 'echoua/echo'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true

      - name: Setup Git LFS and debug
        run: |
          echo "Checking Git LFS status..."
          git lfs install
          git lfs pull
          echo "Checking LFS file: deploy/wd_test-2025-08-17-07-43.pgrestore"
          ls -la deploy/wd_test-2025-08-17-07-43.pgrestore
          file deploy/wd_test-2025-08-17-07-43.pgrestore
          echo "First 50 bytes:"
          head -c 50 deploy/wd_test-2025-08-17-07-43.pgrestore | hexdump -C

      - name: Restore npm cache
        run: ./scripts/cache/restore-npm.sh || true

      - name: Run frontend tests
        run: just test-fe

      - name: Save npm cache
        if: always()
        run: ./scripts/cache/save-npm.sh

      - name: Discord notification - Frontend tests
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_CI }}
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            ./scripts/notifications/discord-notify.sh ci_failure "" "Frontend Tests Failed" "Frontend tests encountered failures"
          fi

  backend-tests:
    if: github.repository == 'echoua/echo'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true

      - name: Setup Git LFS and debug
        run: |
          echo "Checking Git LFS status..."
          git lfs install
          git lfs pull
          echo "Checking LFS file: deploy/wd_test-2025-08-17-07-43.pgrestore"
          ls -la deploy/wd_test-2025-08-17-07-43.pgrestore
          file deploy/wd_test-2025-08-17-07-43.pgrestore
          echo "First 50 bytes:"
          head -c 50 deploy/wd_test-2025-08-17-07-43.pgrestore | hexdump -C

      - name: Restore Python cache
        run: ./scripts/cache/restore-python.sh || true

      - name: Restore Spacy cache
        run: ./scripts/cache/restore-spacy.sh || true

      - name: Run backend tests
        env:
          GITHUB_ACTIONS: true
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: just ci-test-be

      - name: Save Python cache
        if: always()
        run: ./scripts/cache/save-python.sh

      - name: Save Spacy cache
        if: always()
        run: ./scripts/cache/save-spacy.sh

      - name: Discord notification - Backend tests
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_CI }}
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            ./scripts/notifications/discord-notify.sh ci_failure "" "Backend Tests Failed" "Backend tests encountered failures"
          fi

  notify-completion:
    # Disabled: previously sent overall CI failure Discord notification ("💥 CI Tests Failed").
    # Intentionally left as a no-op job to preserve workflow structure if referenced elsewhere.
    if: false
    needs: [frontend-tests, backend-tests]
    runs-on: self-hosted
    steps:
      - name: Skip overall CI failure notification
        run: echo "Overall CI failure Discord notification disabled."

  build-and-publish-debs:
    if: github.repository == 'echoua/echo'
    name: Build and publish deb packages (amd64)
    runs-on: [self-hosted, Linux, X64]
    env:
      # Optional echo-ci SSH configuration. If these secrets are not set, the
      # publish step is skipped and we only upload GitHub artifacts.
      ECHO_CI_SSH_HOST: ${{ secrets.ECHO_CI_SSH_HOST }}
      ECHO_CI_SSH_USER: ${{ secrets.ECHO_CI_SSH_USER }}
      ECHO_CI_SSH_KEY: ${{ secrets.ECHO_CI_SSH_KEY }}
      # Repo/dist/component names can be overridden via secrets; defaults below
      ECHO_CI_REPO: ${{ secrets.ECHO_CI_REPO || 'echo' }}
      ECHO_CI_DIST: ${{ secrets.ECHO_CI_DIST || 'jammy' }}
      ECHO_CI_COMPONENT: ${{ secrets.ECHO_CI_COMPONENT || 'main' }}
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
          clean: false

      - name: Setup Git LFS and debug
        run: |
          echo "Checking Git LFS status..."
          git lfs install
          git lfs pull

      - name: Add elm-land to PATH
        shell: bash
        run: |
          set -euo pipefail
          for d in \
            /home/ubuntu/.nvm/versions/node/*/bin \
            /home/build/.nvm/versions/node/*/bin \
            "$HOME/.nvm/versions/node"/*/bin \
            "$HOME/.local/bin" \
            /home/ubuntu/.local/bin; do
            if [ -d "$d" ] && [ -x "$d/elm-land" ]; then
              echo "Adding $d to PATH"
              echo "$d" >> "$GITHUB_PATH"
              break
            fi
          done

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build deb packages
        run: bash deploy/ci/build_debs.sh

      - name: Upload debs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echo-debs-${{ github.run_id }}-amd64
          path: |
            target/debian/*.deb
          if-no-files-found: error

      - name: Publish to echo-ci (aptly)
        run: |
          if [ -n "${{ env.ECHO_CI_SSH_HOST }}" ] && [ -n "${{ env.ECHO_CI_SSH_USER }}" ] && [ -n "${{ env.ECHO_CI_SSH_KEY }}" ]; then
            bash deploy/ci/publish_echo_ci.sh
          else
            echo "Skipping publish: ECHO_CI_* secrets are not configured"
          fi

      - name: Remove target on failure
        if: failure()
        run: rm -rf target
