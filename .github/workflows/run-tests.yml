name: CI Build Test and Publish (amd64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-and-publish:
    if: github.repository == 'echoua/echo'
    name: Build, test, and publish deb packages (amd64)
    runs-on: [self-hosted, Linux, X64]
    env:
      # Optional echo-ci SSH configuration. If these secrets are not set, the
      # publish step is skipped and we only upload GitHub artifacts.
      ECHO_CI_SSH_HOST: ${{ secrets.ECHO_CI_SSH_HOST }}
      ECHO_CI_SSH_USER: ${{ secrets.ECHO_CI_SSH_USER }}
      ECHO_CI_SSH_KEY: ${{ secrets.ECHO_CI_SSH_KEY }}
      # Repo/dist/component names can be overridden via secrets; defaults below
      ECHO_CI_REPO: ${{ secrets.ECHO_CI_REPO || 'echo' }}
      ECHO_CI_DIST: ${{ secrets.ECHO_CI_DIST || 'jammy' }}
      ECHO_CI_COMPONENT: ${{ secrets.ECHO_CI_COMPONENT || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch only the required LFS file via sparse checkout.
          lfs: true
          clean: false
          sparse-checkout: |
            deploy/wd_test-2025-08-17-07-43.pgrestore
          sparse-checkout-cone: false

      - name: Verify required LFS dump presence
        shell: "bash --noprofile --norc {0}"
        run: |
          set -euo pipefail
          echo "Verifying LFS file exists and is downloaded..."
          test -f deploy/wd_test-2025-08-17-07-43.pgrestore
          ls -la deploy/wd_test-2025-08-17-07-43.pgrestore
          file deploy/wd_test-2025-08-17-07-43.pgrestore || true

      - name: Restore caches (npm/python/spacy)
        shell: "bash --noprofile --norc {0}"
        run: |
          ./scripts/cache/restore-npm.sh || true
          ./scripts/cache/restore-python.sh || true
          ./scripts/cache/restore-spacy.sh || true

      - name: Add elm-land to PATH (glob-safe)
        shell: "bash --noprofile --norc {0}"
        run: |
          set -euo pipefail
          add_if_found() {
            local d="$1"
            if [ -d "$d" ] && [ -x "$d/elm-land" ]; then
              echo "Adding $d to PATH"
              echo "$d" >> "$GITHUB_PATH"
              return 0
            fi
            return 1
          }
          # Check a few common locations directly
          add_if_found "$HOME/.local/bin" && exit 0
          add_if_found /home/ubuntu/.local/bin && exit 0
          # Avoid expansive globs: probe via find with limits
          for base in "$HOME/.nvm/versions/node" /home/ubuntu/.nvm/versions/node /home/build/.nvm/versions/node; do
            if [ -d "$base" ]; then
              # Find up to 5 candidate bin dirs, then stop at first with elm-land
              while IFS= read -r d; do
                add_if_found "$d" && exit 0
              done < <(find "$base" -maxdepth 2 -type d -name bin -print 2>/dev/null | head -n 5)
            fi
          done
          echo "elm-land not found; continuing without modifying PATH"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run combined FE/BE tests (single build)
        shell: "bash --noprofile --norc {0}"
        env:
          GITHUB_ACTIONS: true
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash deploy/run_backend_tests.sh

      - name: Mark deploy started in redis (echo-ci)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: "bash --noprofile --norc {0}"
        run: bash deploy/ci/redis_mark_deploy.sh started

      - name: Build deb packages
        shell: 'bash --noprofile --norc {0}'
        run: bash deploy/ci/build_debs.sh

      - name: Save caches (npm/python/spacy)
        if: always()
        shell: 'bash --noprofile --norc {0}'
        run: |
          ./scripts/cache/save-npm.sh || true
          ./scripts/cache/save-python.sh || true
          ./scripts/cache/save-spacy.sh || true

      # Publish directly from this job for speed. Do not gate on secrets;
      # the script falls back to runner-configured SSH (like echo-install-utils/echo-gpu).
      - name: Publish to echo-ci (aptly)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: 'bash --noprofile --norc {0}'
        run: bash deploy/ci/publish_echo_ci.sh

      - name: Mark deploy finished in redis (echo-ci)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: 'bash --noprofile --norc {0}'
        run: bash deploy/ci/redis_mark_deploy.sh finished

      - name: Discord notification - CI failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL_CI: ${{ secrets.DISCORD_WEBHOOK_URL_CI }}
        shell: 'bash --noprofile --norc {0}'
        run: |
          set -euo pipefail
          # Send a Discord alert; do not break further if webhook is missing
          ./scripts/notifications/discord-notify.sh \
            ci_failure "" "CI Build Failed" \
            "Build failed in workflow 'CI Build Test and Publish (amd64)'." || true

      - name: Remove target on failure
        if: failure()
        shell: 'bash --noprofile --norc {0}'
        run: rm -rf target
