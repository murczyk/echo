name: CI Build Test and Publish (amd64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-and-publish:
    if: github.repository == 'echoua/echo'
    name: Build, test, and publish deb packages (amd64)
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: [self-hosted, Linux, X64]
    env:
      GIT_TERMINAL_PROMPT: 0
      ECHO_BUILD_MAIN_SSH_TARGET: ${{ secrets.ECHO_BUILD_MAIN_SSH_TARGET || 'echo-build-main' }}
      ECHO_BUILD_MAIN_SSH_KEY: ${{ secrets.ECHO_BUILD_MAIN_SSH_KEY }}
      ECHO_BUILD_MAIN_WORKDIR: ${{ secrets.ECHO_BUILD_MAIN_WORKDIR || '~/workspace/echo' }}
      # Optional echo-ci SSH configuration. If these secrets are not set, the
      # publish step is skipped and we only upload GitHub artifacts.
      ECHO_CI_SSH_HOST: ${{ secrets.ECHO_CI_SSH_HOST }}
      ECHO_CI_SSH_USER: ${{ secrets.ECHO_CI_SSH_USER }}
      ECHO_CI_SSH_KEY: ${{ secrets.ECHO_CI_SSH_KEY }}
      # GPG signing configuration on echo-ci host (optional but recommended)
      ECHO_CI_GPG_KEYID: ${{ secrets.ECHO_CI_GPG_KEYID }}
      ECHO_CI_GPG_PASSPHRASE_FILE: ${{ secrets.ECHO_CI_GPG_PASSPHRASE_FILE }}
      ECHO_CI_GPG_PROVIDER: ${{ secrets.ECHO_CI_GPG_PROVIDER }}
      # Repo/dist/component names can be overridden via secrets; defaults below
      ECHO_CI_REPO: ${{ secrets.ECHO_CI_REPO || 'echo' }}
      ECHO_CI_DIST: ${{ secrets.ECHO_CI_DIST || 'jammy' }}
      ECHO_CI_COMPONENT: ${{ secrets.ECHO_CI_COMPONENT || 'main' }}
    steps:
      - name: Ensure clean git state (keep caches)
        shell: "bash --noprofile --norc {0}"
        run: |
          set -euo pipefail
          # Self-hosted runner: keep ignored caches like `target/`, `.venv/`, `node_modules/`
          # to avoid re-downloading models/deps and to reuse Cargo build artifacts across runs.
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            echo "Reusing existing checkout in $GITHUB_WORKSPACE (preserving ignored caches)"
            cd "$GITHUB_WORKSPACE"
            git reset --hard
            git clean -ffd
          else
            echo "No existing checkout found in $GITHUB_WORKSPACE; proceeding with fresh checkout"
          fi

      - uses: actions/checkout@v4
        with:
          # Ensure LFS files are fetched as real binaries
          lfs: true
          clean: false

      - name: Ensure runner transport tools installed and checkout LFS objects
        timeout-minutes: 5
        shell: "bash --noprofile --norc {0}"
        run: |
          set -euo pipefail
          install_with_supported_pkg_manager() {
            local package_name="$1"
            if command -v apt-get >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1; then
                sudo apt-get update && sudo apt-get install -y "$package_name"
              else
                apt-get update && apt-get install -y "$package_name"
              fi
            elif command -v dnf >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1; then
                sudo dnf install -y "$package_name"
              else
                dnf install -y "$package_name"
              fi
            elif command -v yum >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1; then
                sudo yum install -y "$package_name"
              else
                yum install -y "$package_name"
              fi
            elif command -v apk >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1; then
                sudo apk add --no-cache "$package_name"
              else
                apk add --no-cache "$package_name"
              fi
            elif command -v pacman >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1; then
                sudo pacman -Sy --noconfirm "$package_name"
              else
                pacman -Sy --noconfirm "$package_name"
              fi
            else
              echo "No supported package manager found to install $package_name. Please install it on the runner." >&2
              exit 1
            fi
          }

          echo "Checking for git-lfs and rsync..."
          if ! command -v git >/dev/null 2>&1; then
            echo "git is required" >&2
            exit 1
          fi
          if ! command -v git-lfs >/dev/null 2>&1 && ! command -v git\ lfs >/dev/null 2>&1; then
            echo "git-lfs not found, attempting to install..."
            install_with_supported_pkg_manager git-lfs
          fi
          if ! command -v rsync >/dev/null 2>&1; then
            echo "rsync not found, attempting to install..."
            install_with_supported_pkg_manager rsync
          fi

          echo "Initializing Git LFS and ensuring binaries are present..."
          git lfs install
          # Fetch all LFS objects needed for current checkout and replace pointers
          git lfs fetch --all
          git lfs checkout

      - name: Verify key LFS binaries/materialized files
        timeout-minutes: 2
        shell: "bash --noprofile --norc {0}"
        run: |
          set -euo pipefail
          for path in \
            deploy/wd_test-2025-08-17-07-43.pgrestore \
            deploy/echo-whatsapp/echo-whatsapp \
            deploy/signal-cli/signal-cli-native \
            deploy/signal-cli/signal-cli-rest-api; do
            if [ -f "$path" ]; then
              echo "Found: $path"
              if command -v file >/dev/null 2>&1; then
                file "$path" || true
              else
                ls -lh "$path" || true
              fi
            else
              echo "WARNING: Missing expected LFS file: $path" >&2
            fi
          done

      - name: Sync checkout to echo-build-main
        shell: "bash --noprofile --norc {0}"
        run: bash deploy/ci/run_on_build_main.sh sync

      - name: Run combined FE/BE tests on echo-build-main
        shell: "bash --noprofile --norc {0}"
        run: bash deploy/ci/run_on_build_main.sh stage run-tests

      - name: Mark deploy started in redis on echo-build-main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: "bash --noprofile --norc {0}"
        run: bash deploy/ci/run_on_build_main.sh stage redis-mark started

      - name: Build deb packages on echo-build-main
        shell: "bash --noprofile --norc {0}"
        run: bash deploy/ci/run_on_build_main.sh stage build-debs

      # Temporarily disable cache saving to reduce risk of hangs
      #- name: Save caches (npm/python/spacy)
      #  if: ${{ !cancelled() }}
      #  timeout-minutes: 2
      #  shell: 'bash --noprofile --norc {0}'
      #  run: |
      #    ./scripts/cache/save-npm.sh || true
      #    ./scripts/cache/save-python.sh || true
      #    ./scripts/cache/save-spacy.sh || true

      # Publish directly from this job for speed. Do not gate on secrets;
      # the script falls back to runner-configured SSH when explicit secrets are absent.
      - name: Publish to echo-ci from echo-build-main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: "bash --noprofile --norc {0}"
        run: bash deploy/ci/run_on_build_main.sh stage publish

      - name: Mark deploy finished in redis on echo-build-main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: "bash --noprofile --norc {0}"
        run: bash deploy/ci/run_on_build_main.sh stage redis-mark finished

      - name: Discord notification - CI failure
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DISCORD_WEBHOOK_URL_CI: ${{ secrets.DISCORD_WEBHOOK_URL_CI }}
        shell: "bash --noprofile --norc {0}"
        run: |
          set -euo pipefail
          # Send a Discord alert; do not break further if webhook is missing
          ./scripts/notifications/discord-notify.sh \
            ci_failure "" "CI Build Failed" \
            "Build failed in workflow 'CI Build Test and Publish (amd64)'." || true

      - name: Remove remote target on failure
        if: failure()
        shell: "bash --noprofile --norc {0}"
        run: bash deploy/ci/run_on_build_main.sh stage cleanup-failure
