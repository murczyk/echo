name: CI Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean_cache:
        description: "Clean Python dependency cache"
        required: false
        default: false
        type: boolean

jobs:
  frontend-tests:
    if: github.repository == 'echoua/echo'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Setup cache
        run: just ci-setup-cache-frontend

      - name: Run frontend tests
        run: just test-fe

      - name: Save cache
        run: just ci-save-cache-frontend

  backend-tests:
    if: github.repository == 'echoua/echo'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Setup cache
        run: |
          if [ "${{ github.event.inputs.clean_cache }}" = "true" ]; then
            just ci-setup-cache clean
          else
            just ci-setup-cache
          fi

      - name: Run backend tests
        env:
          GITHUB_ACTIONS: true
        run: just ci-test-be

      - name: Save cache
        run: |
          if [ "${{ github.event.inputs.clean_cache }}" = "true" ]; then
            just ci-save-cache clean
          else
            just ci-save-cache
          fi
