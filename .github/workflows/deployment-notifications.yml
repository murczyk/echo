name: Deployment & Release Notifications

on:
  release:
    types: [published, prereleased]
  deployment_status:
  workflow_run:
    workflows: ["CI Run Tests"]
    types: [completed]

jobs:
  notify-release:
    if: github.event_name == 'release'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Discord notification - Release
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_CI }}
        run: |
          if [ "${{ github.event.action }}" = "published" ]; then
            ./scripts/notifications/discord-notify.sh release_published "" "🚀 Release Published" "New release **${{ github.event.release.tag_name }}** has been published!\\n\\n${{ github.event.release.body }}"
          else
            ./scripts/notifications/discord-notify.sh release_prerelease "" "⚠️ Pre-release Published" "New pre-release **${{ github.event.release.tag_name }}** has been published!\\n\\n${{ github.event.release.body }}"
          fi

  notify-deployment:
    if: github.event_name == 'deployment_status'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Discord notification - Deployment
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_CI }}
        run: |
          environment="${{ github.event.deployment.environment }}"
          ref="${{ github.event.deployment.ref }}"

          case "${{ github.event.deployment_status.state }}" in
            "success")
              ./scripts/notifications/discord-notify.sh deployment_success "" "🟢 Deployment Successful" "Deployment to **$environment** completed successfully\\n\\nRef: \`$ref\`"
              ;;
            "failure"|"error")
              ./scripts/notifications/discord-notify.sh deployment_failure "" "🔴 Deployment Failed" "Deployment to **$environment** failed\\n\\nRef: \`$ref\`\\n\\n${{ github.event.deployment_status.description }}"
              ;;
            "pending")
              ./scripts/notifications/discord-notify.sh deployment_pending "warning" "🟡 Deployment In Progress" "Deployment to **$environment** is in progress\\n\\nRef: \`$ref\`"
              ;;
          esac

  notify-workflow-completion:
    # Disabled: previously sent failure Discord notification for CI workflow runs
    # ("🧪 ❌ Workflow 'CI Run Tests' Failed").
    if: false
    runs-on: self-hosted
    steps:
      - name: Skip workflow-completion failure notification
        run: echo "Workflow failure Discord notification disabled."
