name: Security & Issue Notifications

on:
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  push:
    branches: [main, master]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/yarn.lock"
      - "**/requirements.txt"
      - "**/Pipfile.lock"

jobs:
  notify-security-advisory:
    if: github.event_name == 'security_advisory'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Discord notification - Security Advisory
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          severity="${{ github.event.security_advisory.severity }}"
          if [ "${{ github.event.action }}" = "published" ]; then
            ./scripts/notifications/discord-notify.sh security_advisory "" "🚨 Security Advisory Published" "**Severity:** $severity\\n**Summary:** ${{ github.event.security_advisory.summary }}\\n\\n${{ github.event.security_advisory.description }}"
          else
            ./scripts/notifications/discord-notify.sh security_advisory "" "⚠️ Security Advisory Updated" "**Severity:** $severity\\n**Summary:** ${{ github.event.security_advisory.summary }}\\n\\n${{ github.event.security_advisory.description }}"
          fi

  notify-vulnerability-alert:
    if: github.event_name == 'pull_request' && (github.actor == 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'security') || contains(github.event.pull_request.labels.*.name, 'dependencies'))
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Discord notification - Vulnerability PR
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          pr_title="${{ github.event.pull_request.title }}"
          pr_number="${{ github.event.pull_request.number }}"
          pr_url="${{ github.event.pull_request.html_url }}"
          ./scripts/notifications/discord-notify.sh vulnerability_alert "" "🔍 Security/Dependency PR" "PR #$pr_number: $pr_title\\n$pr_url"

  notify-critical-issues:
    if: github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'critical') || contains(github.event.issue.labels.*.name, 'security') || contains(github.event.issue.labels.*.name, 'bug'))
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Discord notification - Critical Issue
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          issue_title="${{ github.event.issue.title }}"
          issue_body="${{ github.event.issue.body }}"

          case "${{ github.event.action }}" in
            "opened")
              ./scripts/notifications/discord-notify.sh critical_issue "" "🚨 Critical Issue Opened" "**Issue #${{ github.event.issue.number }}:** $issue_title\\n\\n$issue_body\\n\\nAuthor: @${{ github.event.issue.user.login }}"
              ;;
            "closed")
              ./scripts/notifications/discord-notify.sh critical_issue "success" "✅ Critical Issue Closed" "**Issue #${{ github.event.issue.number }}:** $issue_title\\n\\nAuthor: @${{ github.event.issue.user.login }}"
              ;;
            "reopened")
              ./scripts/notifications/discord-notify.sh critical_issue "warning" "🔄 Critical Issue Reopened" "**Issue #${{ github.event.issue.number }}:** $issue_title\\n\\nAuthor: @${{ github.event.issue.user.login }}"
              ;;
          esac

  notify-urgent-comments:
    if: github.event_name == 'issue_comment' && (contains(github.event.comment.body, '@everyone') || contains(github.event.comment.body, 'URGENT') || contains(github.event.comment.body, 'CRITICAL'))
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Discord notification - Urgent Comment
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          ./scripts/notifications/discord-notify.sh critical_issue "" "🚨 Urgent Comment" "**Issue #${{ github.event.issue.number }}:** ${{ github.event.issue.title }}\\n\\n**Comment by @${{ github.event.comment.user.login }}:**\\n${{ github.event.comment.body }}"

  notify-dependency-changes:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Check for dependency changes
        id: dep_check
        run: |
          changed_files=$(git diff --name-only HEAD^ HEAD)
          dep_files=""

          for file in $changed_files; do
            case "$file" in
              **/Cargo.toml|**/Cargo.lock|**/package.json|**/package-lock.json|**/yarn.lock|**/requirements.txt|**/Pipfile.lock)
                dep_files="$dep_files\\n- \`$file\`"
                ;;
            esac
          done

          if [ -n "$dep_files" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "changed_files=$dep_files" >> $GITHUB_OUTPUT
          fi

      - name: Discord notification - Dependency Changes
        if: steps.dep_check.outputs.has_changes == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          ./scripts/notifications/discord-notify.sh dependency_update "" "📦 Dependencies Updated" "The following dependency files were modified:${{ steps.dep_check.outputs.changed_files }}"
