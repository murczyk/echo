name: Web E2E Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    if: github.repository == 'echoua/echo'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: wdintel-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: wdintel-web/package-lock.json
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run e2e:install

      - name: Run e2e smoke tests
        run: npm run e2e
