# Checks that all checkboxes in a PR are checked

name: Pull Request Checkboxes

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited

concurrency:
  group: ${{ github.event.pull_request.number }}-pr-checkboxes
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: "read"
  pull-requests: "read"

jobs:
  pr-checkboxes:
    name: Check PR checkboxes
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub

      - name: Determine if PR is WIP
        id: pr_meta
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python - <<'PY'
          import os

          title = os.getenv("PR_TITLE", "")
          normalized = title.lstrip().lower()
          is_wip = normalized.startswith("wip") or normalized.startswith("[wip]")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"is_wip={str(is_wip).lower()}\n")

          print(f"PR title: {title!r}")
          print(f"Is WIP: {is_wip}")
          PY

      - name: Check PR checkboxes
        id: checkbox_check
        run: |
          python ./scripts/ci/check_pr_checkboxes.py \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --github-repository ${{ github.repository }} \
            --pr-number ${{ github.event.pull_request.number }}

      - name: Discord notification - PR Checkbox Check (failures only)
        if: failure() && steps.pr_meta.outputs.is_wip != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_CI }}
        run: |
          ./scripts/notifications/discord-notify.sh pr_check_failure "" "PR Checkboxes Invalid" "Some required checkboxes are missing in PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
