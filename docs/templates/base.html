<!DOCTYPE html>
<html lang="{% if page %}{{ page.lang }}{% else %}{{ config.default_language }}{% endif %}">

<head>
    <meta content="text/html; charset=UTF-8" http-equiv="content-type" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" crossorigin="anonymous" />
</head>
<style>
    video, img {
        max-width: 100%;
    }
    #table-of-contents ul {
        list-style: none;
        padding-left: 0;
    }
    #table-of-contents li {
        margin-bottom: 0.25rem;
    }
</style>

<body class="bg-body-secondary">
    <div class="container-fluid min-vh-100 py-3">
        <div class="row g-3">
            <aside class="col-lg-3 col-12">
                <div class="card sticky-top">
                    <div class="card-body">
                        <h5 class="card-title">Зміст</h5>
                        <div id="table-of-contents">
                            {% if section.toc %}
                            <ul class="nav flex-column">
                                {% for h1 in section.toc %}
                                <li class="nav-item">
                                    <a class="nav-link link-body-emphasis py-1" href="{{ h1.permalink | safe }}">{{ h1.title }}</a>
                                </li>
                                {% endfor %}
                            </ul>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </aside>
            <main class="col-lg-9 col-12">
                <div class="card">
                    <div class="card-body">
                        {% block content %}
                        {% endblock content %}
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
