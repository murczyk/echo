<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="t"><title id="t">Схематичне зображення панелі сповіщень</title><rect width="760" height="260" fill="#172033"/><rect x="40" y="25" width="680" height="205" rx="12" fill="#fff"/><text x="65" y="60" font-family="sans-serif" font-size="20" fill="#172033">Сповіщення цієї стрічки</text><text x="65" y="100" font-family="sans-serif" font-size="17" fill="#172033">1. Звукове сповіщення  ●  Готово</text><text x="65" y="135" font-family="sans-serif" font-size="17" fill="#172033">2. Перевірити звук</text><text x="65" y="170" font-family="sans-serif" font-size="17" fill="#172033">3. Браузерне сповіщення  ●  Дозволено</text><text x="65" y="205" font-family="sans-serif" font-size="14" fill="#475569">Схематичне зображення</text></svg>
