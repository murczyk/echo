<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title-01 desc-01">
  <title id="title-01">Сповіщення цієї стрічки</title><desc id="desc-01">Керування сповіщеннями стрічки з увімкненими звуком і браузерними сповіщеннями.</desc>
  <style>.bg{fill:#1f1f1f}.surface{fill:#2c2c2e}.raised{fill:#20252c}.border{stroke:#5e5e64}.h{font:700 36px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}.sub{font:400 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b8c0cc}.label{font:650 19px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}.small{font:500 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b8c0cc}.badge{fill:#93cdf6}.num{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#000;text-anchor:middle}.success{fill:#16a34a}.successText{font:650 15px Inter,ui-sans-serif,system-ui,sans-serif;fill:#d7f7e5}.line{fill:none;stroke:#93cdf6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style>
  <defs><marker id="arrow-01" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1l5 3-5 3" fill="none" stroke="#93cdf6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect class="bg" width="1440" height="640"/><g id="header"><text class="h" x="64" y="76">Сповіщення цієї стрічки</text><text class="sub" x="64" y="110">Увімкніть канали сповіщень і перевірте їх, не закриваючи сторінку.</text></g>
  <g id="toolbar"><rect class="surface border" x="64" y="152" width="1312" height="76" rx="12" stroke-width="1"/><circle cx="100" cy="190" r="7" fill="#5e5e64"/><rect class="raised" x="132" y="171" width="920" height="38" rx="8"/><text class="small" x="156" y="196">Оперативний / стрічка повідомлень</text><rect x="1146" y="166" width="190" height="48" rx="8" fill="#2c6c91"/><circle class="badge" cx="1180" cy="190" r="16"/><text class="num" x="1180" y="196">1</text><text class="label" x="1208" y="196" font-size="16">Керування</text></g>
  <path class="line" d="M1241 230v38h-54" marker-end="url(#arrow-01)"/>
  <g id="panel"><rect class="surface border" x="220" y="266" width="1000" height="300" rx="12" stroke-width="1"/><text class="label" x="252" y="310" font-size="24">Сповіщення цієї стрічки</text><line x1="252" y1="332" x2="1188" y2="332" stroke="#5e5e64"/>
    <g id="sound-row"><circle class="badge" cx="274" cy="382" r="20"/><text class="num" x="274" y="388">2</text><text class="label" x="310" y="379">Звукове сповіщення</text><text class="small" x="310" y="404">Сигнал для нових повідомлень</text><rect x="734" y="360" width="148" height="44" rx="8" fill="#20252c" stroke="#5e5e64"/><text class="small" x="752" y="388">Перевірити звук</text><rect x="918" y="365" width="104" height="34" rx="17" fill="#16a34a"/><circle cx="1004" cy="382" r="13" fill="#fff"/><rect class="success" x="1050" y="366" width="112" height="32" rx="16"/><path d="M1065 382l5 5 9-11" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="successText" x="1083" y="387">Готово</text></g>
    <line x1="252" y1="430" x2="1188" y2="430" stroke="#5e5e64"/>
    <g id="browser-row"><circle class="badge" cx="274" cy="480" r="20"/><text class="num" x="274" y="486">3</text><text class="label" x="310" y="477">Браузерне сповіщення</text><text class="small" x="310" y="502">Банер Chrome для нових повідомлень</text><rect x="678" y="458" width="204" height="44" rx="8" fill="#20252c" stroke="#5e5e64"/><text class="small" x="696" y="486">Перевірити браузер</text><rect x="918" y="463" width="104" height="34" rx="17" fill="#16a34a"/><circle cx="1004" cy="480" r="13" fill="#fff"/><rect class="success" x="1050" y="464" width="112" height="32" rx="16"/><path d="M1065 480l5 5 9-11" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="successText" x="1083" y="485">Дозволено</text></g>
    <text class="small" x="252" y="542">Остання успішна перевірка сервера: 12:40</text><text x="811" y="542" class="small" fill="#93cdf6">Як налаштувати браузер і систему</text></g>
</svg>
