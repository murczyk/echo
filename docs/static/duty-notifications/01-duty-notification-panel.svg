<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title-01 desc-01">
  <title id="title-01">Панель налаштування сповіщень для стрічки</title>
  <desc id="desc-01">Ілюстрація показує, як відкрити панель сповіщень стрічки та перевірити звук і браузерний канал.</desc>
  <style>text{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h{font-size:34px;font-weight:700;fill:#f8fafc}.label{font-size:25px;font-weight:600;fill:#f8fafc}.sub{font-size:20px;fill:#b8bec8}.small{font-size:18px;fill:#b8bec8}.num{font-size:22px;font-weight:700;fill:#101216}.call{font-size:16px;font-weight:600;fill:#f8fafc}</style>
  <rect width="1440" height="640" fill="#101216"/><text class="h" x="64" y="72">Сповіщення цієї стрічки</text><text class="sub" x="64" y="108">Увімкніть канали та перевірте їх у межах відкритої сторінки.</text>
  <rect x="64" y="148" width="1312" height="78" rx="16" fill="#181b21" stroke="#4b5563" stroke-width="2"/><rect x="88" y="168" width="116" height="38" rx="12" fill="#20252c" stroke="#4b5563" stroke-width="2"/><path d="M110 187h22m-11-11v22m16-11h34" stroke="#b8bec8" stroke-width="3" stroke-linecap="round"/>
  <rect x="1054" y="163" width="152" height="48" rx="12" fill="#20252c" stroke="#93c5fd" stroke-width="3"/><path d="M1080 187c12-16 28-16 40 0m-36 0c0 11 8 18 16 18s16-7 16-18m-24 21h16" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/><text class="small" x="1226" y="194">Сповіщення</text><path d="M1130 226v30" stroke="#93c5fd" stroke-width="3" stroke-dasharray="7 7"/><path d="M1123 248l7 10 7-10" fill="#93c5fd"/>
  <rect x="218" y="252" width="1004" height="338" rx="18" fill="#181b21" stroke="#93c5fd" stroke-width="3"/><text class="label" x="254" y="300">Сповіщення цієї стрічки</text><rect x="254" y="326" width="932" height="2" fill="#4b5563"/>
  <text class="label" x="254" y="372">Звукове сповіщення</text><rect x="900" y="340" width="78" height="40" rx="20" fill="#93c5fd"/><circle cx="956" cy="360" r="15" fill="#101216"/><circle cx="1018" cy="360" r="10" fill="#74c69d"/><text class="sub" x="1038" y="368">Готово</text><rect x="254" y="400" width="260" height="52" rx="12" fill="#20252c" stroke="#93c5fd" stroke-width="2"/><text class="sub" x="280" y="434">Перевірити звук</text>
  <text class="label" x="254" y="496">Браузерне сповіщення</text><rect x="900" y="464" width="78" height="40" rx="20" fill="#93c5fd"/><circle cx="956" cy="484" r="15" fill="#101216"/><circle cx="1018" cy="484" r="10" fill="#74c69d"/><text class="sub" x="1038" y="492">Дозволено</text><rect x="254" y="524" width="384" height="52" rx="12" fill="#20252c" stroke="#93c5fd" stroke-width="2"/><text class="small" x="280" y="558">Перевірити браузерне сповіщення</text><text class="small" x="672" y="548">Остання успішна перевірка сервера: 12:40</text><text class="small" x="672" y="576" fill="#93c5fd">Як налаштувати браузер і систему</text>
  <circle cx="128" cy="184" r="21" fill="#93c5fd"/><text class="num" x="121" y="192">1</text><text class="call" x="64" y="244">Відкрийте керування</text><circle cx="174" cy="360" r="21" fill="#93c5fd"/><text class="num" x="167" y="368">2</text><text class="call" x="64" y="410">Увімкніть звук</text><circle cx="174" cy="484" r="21" fill="#93c5fd"/><text class="num" x="167" y="492">3</text><text class="call" x="64" y="534">Дозвіл браузера</text>
</svg>
