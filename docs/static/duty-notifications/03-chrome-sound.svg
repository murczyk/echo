<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title-03 desc-03">
  <title id="title-03">Перевірка звуку</title><desc id="desc-03">Три послідовні кроки для перевірки звуку.</desc>
  <style>.bg{fill:#1f1f1f}.card{fill:#2c2c2e}.h{font:700 36px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}.sub{font:400 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b8c0cc}.label{font:650 20px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}.small{font:500 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b8c0cc}.badge{fill:#93cdf6}.num{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#000;text-anchor:middle}.line{fill:none;stroke:#93cdf6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style>
  <defs><marker id="arrow-03" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1l5 3-5 3" fill="none" stroke="#93cdf6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect class="bg" width="1440" height="640"/><g id="header"><text class="h" x="64" y="76">Перевірка звуку</text><text class="sub" x="64" y="110">Пройдіть три короткі перевірки послідовно.</text></g>
  <path class="line" d="M468 348h72m360 0h72" marker-end="url(#arrow-03)"/>
  <g id="step-1"><rect class="card" x="64" y="166" width="404" height="354" rx="12"/><circle class="badge" cx="104" cy="210" r="20"/><text class="num" x="104" y="216">1</text><text class="label" x="140" y="216">Звук вкладки увімкнено</text><rect x="96" y="252" width="340" height="92" rx="8" fill="#20252c"/><path d="M128 287h18l21-18v58l-21-18h-18zM180 285q14 13 0 26m14-36q25 23 0 46" fill="none" stroke="#93cdf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="label" x="226" y="294">Звук активний</text><text class="small" x="226" y="319">Вкладка відтворює звук</text><rect x="96" y="376" width="340" height="76" rx="8" fill="#312326"/><path d="M128 405h18l21-18v50l-21-18h-18zM181 400l24 24m0-24l-24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="small" x="226" y="410" fill="#ffb4b4">Звук вимкнено — увімкніть його</text></g>
  <g id="step-2"><rect class="card" x="540" y="166" width="360" height="354" rx="12"/><circle class="badge" cx="580" cy="210" r="20"/><text class="num" x="580" y="216">2</text><text class="label" x="616" y="216">Гучність і пристрій</text><text class="small" x="572" y="274">Медіагучність</text><rect x="572" y="292" width="292" height="8" rx="4" fill="#5e5e64"/><rect x="572" y="292" width="220" height="8" rx="4" fill="#93cdf6"/><circle cx="792" cy="296" r="10" fill="#93cdf6"/><text class="small" x="572" y="360">Вивід звуку</text><rect x="572" y="378" width="292" height="48" rx="8" fill="#20252c" stroke="#5e5e64"/><text class="small" x="592" y="407">Поточний пристрій</text><path d="M832 395l8 8 8-8" fill="none" stroke="#93cdf6" stroke-width="2" stroke-linecap="round"/></g>
  <g id="step-3"><rect class="card" x="972" y="166" width="404" height="354" rx="12"/><circle class="badge" cx="1012" cy="210" r="20"/><text class="num" x="1012" y="216">3</text><text class="label" x="1048" y="216">ЕХО</text><path d="M1150 278h28l34-28v112l-34-28h-28zM1230 274q28 30 0 60m20-82q47 51 0 104" fill="none" stroke="#93cdf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="1052" y="408" width="244" height="52" rx="8" fill="#2c6c91"/><path d="M1080 425h12l15-12v42l-15-12h-12z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><text class="label" x="1124" y="441" font-size="17">Перевірити звук</text></g>
</svg>
