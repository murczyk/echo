<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title-03 desc-03">
  <title id="title-03">Перевірка звуку для сповіщень</title><desc id="desc-03">Три пов’язані області показують активну вкладку, гучність і пристрій виводу, а також кнопку перевірки звуку.</desc>
  <style>text{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h{font-size:34px;font-weight:700;fill:#f8fafc}.label{font-size:25px;font-weight:600;fill:#f8fafc}.sub{font-size:20px;fill:#b8bec8}.num{font-size:22px;font-weight:700;fill:#101216}.call{font-size:20px;font-weight:600;fill:#f8fafc}</style><defs><marker id="arrow-03" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#93c5fd"/></marker></defs>
  <rect width="1440" height="640" fill="#101216"/><text class="h" x="64" y="72">Перевірка звуку</text><text class="sub" x="64" y="108">Пройдіть три короткі перевірки в послідовності.</text>
  <rect x="64" y="164" width="386" height="330" rx="18" fill="#181b21" stroke="#4b5563" stroke-width="2"/><circle cx="102" cy="202" r="21" fill="#93c5fd"/><text class="num" x="95" y="210">1</text><text class="label" x="138" y="211">Вкладка не вимкнена</text><rect x="96" y="244" width="322" height="66" rx="12" fill="#20252c"/><path d="M126 272h16l18-14v38l-18-14h-16zM168 267c7 7 7 17 0 24m10-32c15 15 15 36 0 51" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linejoin="round"/><text class="sub" x="214" y="283">Звук активний</text><rect x="96" y="340" width="322" height="94" rx="12" fill="#20252c" stroke="#f87171" stroke-width="2"/><path d="M124 376h16l18-14v38l-18-14h-16zM118 350l58 58" stroke="#f87171" stroke-width="4" stroke-linecap="round"/><text class="sub" x="208" y="382" fill="#f87171">Вимкнено — виправити</text>
  <path d="M466 328h118" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow-03)"/><rect x="600" y="164" width="386" height="330" rx="18" fill="#181b21" stroke="#4b5563" stroke-width="2"/><circle cx="638" cy="202" r="21" fill="#93c5fd"/><text class="num" x="631" y="210">2</text><text class="label" x="674" y="211">Гучність і пристрій</text><text class="sub" x="632" y="274">Медіагучність</text><rect x="632" y="294" width="290" height="16" rx="8" fill="#4b5563"/><rect x="632" y="294" width="220" height="16" rx="8" fill="#93c5fd"/><circle cx="852" cy="302" r="16" fill="#f8fafc"/><text class="sub" x="632" y="366">Вивід звуку</text><rect x="632" y="388" width="290" height="54" rx="12" fill="#20252c" stroke="#4b5563" stroke-width="2"/><path d="M660 408h14l15-11v36l-15-11h-14z" fill="#b8bec8"/><text class="sub" x="710" y="423">Поточний пристрій</text>
  <path d="M1002 328h118" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow-03)"/><rect x="1136" y="164" width="240" height="330" rx="18" fill="#181b21" stroke="#4b5563" stroke-width="2"/><circle cx="1174" cy="202" r="21" fill="#93c5fd"/><text class="num" x="1167" y="210">3</text><text class="label" x="1210" y="211">ECHO</text><rect x="1168" y="292" width="176" height="82" rx="14" fill="#20252c" stroke="#93c5fd" stroke-width="3"/><text class="sub" x="1188" y="326">Перевірити</text><text class="sub" x="1208" y="353">звук</text><text class="call" x="164" y="570">Вкладка не вимкнена</text><text class="call" x="606" y="570">→ Гучність і пристрій</text><text class="call" x="1040" y="570">→ Перевірити звук</text>
</svg>
