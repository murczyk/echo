<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title-02 desc-02">
  <title id="title-02">Дозвіл браузерних сповіщень у Chrome</title><desc id="desc-02">Абстрактна панель браузера показує шлях від керування сайтом до дозволу на сповіщення і повторної перевірки.</desc>
  <style>text{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h{font-size:34px;font-weight:700;fill:#f8fafc}.label{font-size:25px;font-weight:600;fill:#f8fafc}.sub{font-size:20px;fill:#b8bec8}.num{font-size:22px;font-weight:700;fill:#101216}.call{font-size:20px;font-weight:600;fill:#f8fafc}</style>
  <rect width="1440" height="640" fill="#101216"/><text class="h" x="64" y="72">Дозвіл на сповіщення у Chrome</text><text class="sub" x="64" y="108">Налаштування сайту доступні поруч з адресним полем.</text><rect x="64" y="148" width="1312" height="406" rx="18" fill="#181b21" stroke="#4b5563" stroke-width="2"/>
  <rect x="88" y="174" width="1264" height="68" rx="14" fill="#20252c"/><circle cx="122" cy="208" r="10" fill="#f87171"/><circle cx="154" cy="208" r="10" fill="#fbbf24"/><circle cx="186" cy="208" r="10" fill="#74c69d"/><rect x="246" y="187" width="772" height="42" rx="10" fill="#101216" stroke="#4b5563" stroke-width="2"/><rect x="264" y="194" width="28" height="28" rx="8" fill="#93c5fd"/><path d="M273 206h10m-5-5v10" stroke="#101216" stroke-width="2"/><text class="sub" x="312" y="215">Сайт у браузері</text>
  <rect x="88" y="266" width="790" height="264" rx="14" fill="#20252c"/><rect x="114" y="292" width="324" height="34" rx="8" fill="#4b5563"/><rect x="114" y="344" width="620" height="18" rx="9" fill="#4b5563"/><rect x="114" y="382" width="536" height="18" rx="9" fill="#4b5563"/><rect x="114" y="440" width="212" height="54" rx="12" fill="#181b21" stroke="#4b5563" stroke-width="2"/><text class="sub" x="139" y="475">Сповіщення</text>
  <rect x="910" y="258" width="392" height="280" rx="16" fill="#181b21" stroke="#93c5fd" stroke-width="3"/><text class="label" x="944" y="306">Керування сайтом</text><rect x="944" y="330" width="324" height="2" fill="#4b5563"/><text class="sub" x="944" y="380">Сповіщення</text><rect x="944" y="402" width="324" height="78" rx="12" fill="#20252c" stroke="#93c5fd" stroke-width="3"/><text class="label" x="970" y="450" fill="#93c5fd">Дозволити</text><path d="M1224 431l12 12 12-12" fill="none" stroke="#93c5fd" stroke-width="3"/>
  <circle cx="278" cy="208" r="21" fill="#93c5fd"/><text class="num" x="271" y="216">1</text><text class="call" x="64" y="592">Відкрити керування сайтом</text><circle cx="906" cy="370" r="21" fill="#93c5fd"/><text class="num" x="899" y="378">2</text><text class="call" x="746" y="592">Знайти «Сповіщення»</text><circle cx="1286" cy="441" r="21" fill="#93c5fd"/><text class="num" x="1279" y="449">3</text><path d="M136 570h884" stroke="#93c5fd" stroke-width="3" stroke-dasharray="8 8"/><path d="M1020 562l16 8-16 8" fill="#93c5fd"/><circle cx="1078" cy="570" r="21" fill="#93c5fd"/><text class="num" x="1071" y="578">4</text><text class="call" x="1105" y="565">Перезавантажити ECHO</text><text class="call" x="1105" y="590">і запустити тест</text>
</svg>
