<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title-02 desc-02">
  <title id="title-02">Дозвіл на сповіщення у Chrome</title><desc id="desc-02">Послідовність налаштування дозволу на сповіщення для сайту у Chrome.</desc>
  <style>.bg{fill:#1f1f1f}.surface{fill:#2c2c2e}.h{font:700 36px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}.sub{font:400 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b8c0cc}.label{font:650 19px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}.small{font:500 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b8c0cc}.badge{fill:#93cdf6}.num{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#000;text-anchor:middle}.line{fill:none;stroke:#93cdf6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style>
  <defs><marker id="arrow-02" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1l5 3-5 3" fill="none" stroke="#93cdf6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect class="bg" width="1440" height="640"/><g id="header"><text class="h" x="64" y="76">Дозвіл на сповіщення у Chrome</text><text class="sub" x="64" y="110">Налаштування сайту доступні поруч з адресним полем.</text></g>
  <g id="browser"><rect class="surface" x="64" y="152" width="1312" height="366" rx="12"/><rect fill="#20252c" x="64" y="152" width="1312" height="82" rx="12"/><circle cx="100" cy="182" r="7" fill="#dc2626"/><circle cx="124" cy="182" r="7" fill="#d3871d"/><circle cx="148" cy="182" r="7" fill="#16a34a"/><rect fill="#1f1f1f" x="244" y="166" width="700" height="36" rx="18"/><circle cx="278" cy="184" r="16" fill="#2c6c91"/><path d="M278 176v16m-7-8h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle class="badge" cx="278" cy="146" r="20"/><text class="num" x="278" y="152">1</text><text class="small" x="306" y="152">Відкрити керування сайтом</text><text class="small" x="316" y="190">Сайт у браузері</text><rect fill="#20252c" x="104" y="270" width="500" height="190" rx="10"/><text class="label" x="136" y="314">Сайт у браузері</text><rect fill="#2c2c2e" x="136" y="340" width="436" height="44" rx="8"/><text class="small" x="156" y="368">Сповіщення</text></g>
  <g id="popover"><path d="M267 202l16 22h-32z" fill="#20252c"/><rect x="778" y="246" width="458" height="276" rx="12" fill="#20252c" stroke="#5e5e64"/><text class="label" x="810" y="290">Керування сайтом</text><line x1="810" y1="314" x2="1204" y2="314" stroke="#5e5e64"/><circle class="badge" cx="810" cy="354" r="20"/><text class="num" x="810" y="360">2</text><text class="label" x="846" y="360">Сповіщення</text><rect x="1018" y="334" width="178" height="42" rx="8" fill="#2c6c91"/><text class="small" x="1038" y="361" fill="#fff">Дозволити</text><path d="M1170 350l7 7 7-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle class="badge" cx="1218" cy="355" r="20"/><text class="num" x="1218" y="361">3</text><text class="small" x="846" y="406">Вибрати «Дозволити»</text><line x1="810" y1="432" x2="1204" y2="432" stroke="#5e5e64"/><circle class="badge" cx="810" cy="468" r="20"/><text class="num" x="810" y="474">4</text><path d="M850 459a12 12 0 1 1-5 20" fill="none" stroke="#93cdf6" stroke-width="2" stroke-linecap="round"/><path d="M842 475l3 5 5-3" fill="none" stroke="#93cdf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="small" x="874" y="464">Перезавантажити «ЕХО»</text><text class="small" x="874" y="486">і запустити тест</text></g>
  <path class="line" d="M298 204c88 26 315 44 472 68" marker-end="url(#arrow-02)"/>
