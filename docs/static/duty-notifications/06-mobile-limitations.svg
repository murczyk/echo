<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title-06 desc-06">
  <title id="title-06">Що працює на телефоні</title><desc id="desc-06">Порівняння активної та неактивної сторінки на телефоні.</desc>
  <style>.bg{fill:#1f1f1f}.card{fill:#2c2c2e}.h{font:700 36px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}.sub{font:400 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b8c0cc}.label{font:650 20px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}.small{font:500 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b8c0cc}.success{fill:#16a34a}.error{fill:#dc2626}</style>
  <rect class="bg" width="1440" height="640"/><g id="header"><text class="h" x="64" y="76">Що працює на телефоні</text><text class="sub" x="64" y="110">Порівняйте активну сторінку із заблокованим телефоном або закритим браузером.</text></g>
  <g id="active-card"><rect class="card" x="64" y="152" width="620" height="352" rx="12"/><rect class="success" x="64" y="152" width="6" height="352" rx="3"/><circle cx="112" cy="204" r="18" class="success"/><path d="M103 204l6 6 12-14" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="label" x="146" y="211">Активна сторінка</text><text class="small" x="146" y="238">Телефон розблоковано</text><rect x="280" y="264" width="184" height="204" rx="22" fill="#17191d" stroke="#5e5e64" stroke-width="2"/><rect x="296" y="292" width="152" height="142" rx="8" fill="#20252c"/><rect x="344" y="276" width="56" height="6" rx="3" fill="#5e5e64"/><text class="small" x="316" y="334">ЕХО</text><rect x="316" y="352" width="112" height="38" rx="7" fill="#2c6c91"/><path d="M330 364h10l12-10v30l-12-10h-10z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><text class="small" x="118" y="430">Сторінку «ЕХО» відкрито</text><text class="small" x="118" y="458" fill="#bdf1d5">Звук може відтворюватися</text></g>
  <g id="inactive-card"><rect class="card" x="756" y="152" width="620" height="352" rx="12"/><rect class="error" x="756" y="152" width="6" height="352" rx="3"/><circle cx="804" cy="204" r="18" class="error"/><path d="M796 196l16 16m0-16l-16 16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><text class="label" x="838" y="211">Неактивна сторінка</text><text class="small" x="838" y="238">Телефон заблоковано або браузер закрито</text><rect x="972" y="264" width="184" height="204" rx="22" fill="#17191d" stroke="#5e5e64" stroke-width="2"/><rect x="988" y="292" width="152" height="142" rx="8" fill="#25272b"/><path d="M1038 350h52l-10-22h-32z" fill="#5e5e64"/><rect x="1034" y="350" width="60" height="40" rx="6" fill="#5e5e64"/><circle cx="1064" cy="370" r="7" fill="#25272b"/><text class="small" x="810" y="430">Сповіщення та звук не працюють</text></g>
  <g id="note"><rect x="284" y="536" width="872" height="52" rx="8" fill="#20252c"/><circle cx="320" cy="562" r="13" fill="#93cdf6"/><text x="320" y="568" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">i</text><text class="small" x="348" y="568">На цьому етапі фонової доставки немає</text></g>
</svg>
