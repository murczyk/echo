<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title-06 desc-06">
  <title id="title-06">Можливості сповіщень на телефоні</title><desc id="desc-06">Два стани телефона пояснюють, що звук можливий лише на відкритій розблокованій сторінці, а фонової доставки немає.</desc>
  <style>text{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h{font-size:34px;font-weight:700;fill:#f8fafc}.label{font-size:25px;font-weight:600;fill:#f8fafc}.sub{font-size:20px;fill:#b8bec8}.num{font-size:22px;font-weight:700;fill:#101216}</style>
  <rect width="1440" height="640" fill="#101216"/><text class="h" x="64" y="72">Що працює на телефоні</text><text class="sub" x="64" y="108">Порівняйте активний стан сторінки зі заблокованим або закритим станом.</text>
  <rect x="64" y="148" width="612" height="362" rx="18" fill="#181b21" stroke="#74c69d" stroke-width="3"/><circle cx="106" cy="190" r="21" fill="#74c69d"/><text class="num" x="99" y="198">1</text><text class="label" x="146" y="199">Активна сторінка</text><text class="sub" x="146" y="232">Телефон розблоковано</text><rect x="116" y="258" width="210" height="214" rx="28" fill="#20252c" stroke="#b8bec8" stroke-width="3"/><rect x="134" y="288" width="174" height="142" rx="10" fill="#181b21"/><rect x="148" y="306" width="146" height="28" rx="7" fill="#4b5563"/><rect x="148" y="350" width="146" height="54" rx="10" fill="#20252c" stroke="#93c5fd" stroke-width="2"/><path d="M170 377h14l15-11v34l-15-11h-14zM207 371c7 7 7 17 0 24" fill="none" stroke="#93c5fd" stroke-width="3"/><text class="sub" x="364" y="314">ECHO відкрита</text><text class="sub" x="364" y="362">Звук: можливий</text><path d="M364 390h230" stroke="#74c69d" stroke-width="3"/><path d="M364 416h184" stroke="#4b5563" stroke-width="3"/>
  <rect x="764" y="148" width="612" height="362" rx="18" fill="#181b21" stroke="#f87171" stroke-width="3"/><circle cx="806" cy="190" r="21" fill="#f87171"/><text class="num" x="799" y="198">2</text><text class="label" x="846" y="199">Сторінка неактивна</text><text class="sub" x="846" y="232">Телефон заблоковано або браузер закрито</text><rect x="816" y="258" width="210" height="214" rx="28" fill="#20252c" stroke="#b8bec8" stroke-width="3"/><rect x="834" y="288" width="174" height="142" rx="10" fill="#181b21"/><rect x="886" y="326" width="70" height="64" rx="10" fill="#4b5563"/><path d="M900 326v-14c0-22 42-22 42 0v14" fill="none" stroke="#b8bec8" stroke-width="6"/><path d="M1078 326l74 74m0-74l-74 74" stroke="#f87171" stroke-width="8" stroke-linecap="round"/><text class="sub" x="1062" y="424" fill="#f87171">Сповіщення і звук:</text><text class="sub" x="1062" y="452" fill="#f87171">не працюють</text><rect x="232" y="540" width="976" height="52" rx="14" fill="#20252c" stroke="#4b5563" stroke-width="2"/><text class="sub" x="430" y="574">На цьому етапі немає фонової доставки</text>
</svg>
