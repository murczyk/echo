<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title-04 desc-04">
  <title id="title-04">Сповіщення Chrome у Windows</title><desc id="desc-04">Налаштування Windows для сповіщень Google Chrome.</desc>
  <style>.bg{fill:#1f1f1f}.side{fill:#25272b}.panel{fill:#2c2c2e}.h{font:700 36px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}.sub{font:400 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b8c0cc}.label{font:650 19px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}.small{font:500 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b8c0cc}.badge{fill:#93cdf6}.amber{fill:#d3871d}.num{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#000;text-anchor:middle}</style>
  <rect class="bg" width="1440" height="640"/><g id="header"><text class="h" x="64" y="76">Сповіщення Chrome у Windows</text><text class="sub" x="64" y="110">Система → Сповіщення → Google Chrome</text></g>
  <g id="settings-window"><rect class="panel" x="64" y="152" width="1312" height="426" rx="12"/><rect class="side" x="64" y="152" width="304" height="426" rx="12"/><text class="label" x="96" y="208">Система</text><rect x="84" y="234" width="264" height="48" rx="8" fill="#2c6c91"/><text class="small" x="112" y="264" fill="#fff">Сповіщення</text><text class="small" x="112" y="328">Екран</text><text class="small" x="112" y="384">Звук</text><text class="label" x="416" y="208">Google Chrome</text><text class="small" x="416" y="238">Сповіщення від застосунку</text>
    <g id="notification-rows"><line x1="416" y1="266" x2="1336" y2="266" stroke="#5e5e64"/><circle class="badge" cx="452" cy="314" r="20"/><text class="num" x="452" y="320">1</text><text class="label" x="488" y="320">Сповіщення Chrome</text><rect x="1208" y="293" width="80" height="42" rx="21" fill="#2c6c91"/><circle cx="1267" cy="314" r="16" fill="#fff"/><line x1="416" y1="354" x2="1336" y2="354" stroke="#5e5e64"/><circle class="badge" cx="452" cy="402" r="20"/><text class="num" x="452" y="408">2</text><text class="label" x="488" y="408">Показувати банери</text><rect x="1208" y="381" width="80" height="42" rx="21" fill="#2c6c91"/><circle cx="1267" cy="402" r="16" fill="#fff"/><line x1="416" y1="442" x2="1336" y2="442" stroke="#5e5e64"/><circle class="badge" cx="452" cy="490" r="20"/><text class="num" x="452" y="496">3</text><text class="label" x="488" y="496">Відтворювати звук</text><rect x="1208" y="469" width="80" height="42" rx="21" fill="#2c6c91"/><circle cx="1267" cy="490" r="16" fill="#fff"/></g>
    <g id="do-not-disturb"><circle class="amber" cx="880" cy="540" r="18"/><text class="num" x="880" y="546">4</text><text class="small" x="912" y="546">Режим «Не турбувати» вимкнено</text><rect x="1208" y="519" width="80" height="42" rx="21" fill="#5e5e64"/><circle cx="1229" cy="540" r="16" fill="#fff"/></g></g>
</svg>
