<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title-04 desc-04">
  <title id="title-04">Налаштування сповіщень Chrome у Windows</title><desc id="desc-04">Абстрактна панель системних налаштувань показує ввімкнені сповіщення, банери й звук для Google Chrome та вимкнений режим не турбувати.</desc>
  <style>text{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h{font-size:34px;font-weight:700;fill:#f8fafc}.label{font-size:25px;font-weight:600;fill:#f8fafc}.sub{font-size:20px;fill:#b8bec8}.num{font-size:22px;font-weight:700;fill:#101216}</style>
  <rect width="1440" height="640" fill="#101216"/><text class="h" x="64" y="72">Сповіщення Chrome у Windows</text><text class="sub" x="64" y="108">Система → Сповіщення → Google Chrome</text><rect x="64" y="148" width="1312" height="430" rx="18" fill="#181b21" stroke="#4b5563" stroke-width="2"/><rect x="64" y="148" width="342" height="430" rx="18" fill="#20252c"/><text class="label" x="104" y="208">Система</text><rect x="94" y="236" width="282" height="60" rx="12" fill="#181b21" stroke="#93c5fd" stroke-width="2"/><text class="sub" x="126" y="274">Сповіщення</text><text class="sub" x="126" y="342">Екран</text><text class="sub" x="126" y="398">Звук</text>
  <text class="label" x="462" y="208">Google Chrome</text><text class="sub" x="462" y="242">Сповіщення від застосунку</text><rect x="462" y="270" width="862" height="2" fill="#4b5563"/><text class="label" x="462" y="328">Сповіщення Chrome</text><rect x="1186" y="294" width="82" height="42" rx="21" fill="#93c5fd"/><circle cx="1244" cy="315" r="16" fill="#101216"/><circle cx="432" cy="316" r="21" fill="#93c5fd"/><text class="num" x="425" y="324">1</text><text class="label" x="462" y="408">Показувати банери</text><rect x="1186" y="374" width="82" height="42" rx="21" fill="#93c5fd"/><circle cx="1244" cy="395" r="16" fill="#101216"/><circle cx="432" cy="396" r="21" fill="#93c5fd"/><text class="num" x="425" y="404">2</text><text class="label" x="462" y="488">Відтворювати звук</text><rect x="1186" y="454" width="82" height="42" rx="21" fill="#93c5fd"/><circle cx="1244" cy="475" r="16" fill="#101216"/><circle cx="432" cy="476" r="21" fill="#93c5fd"/><text class="num" x="425" y="484">3</text><rect x="1008" y="512" width="316" height="48" rx="12" fill="#20252c" stroke="#4b5563" stroke-width="2"/><text class="sub" x="1030" y="544">Не турбувати</text><rect x="1210" y="520" width="78" height="32" rx="16" fill="#4b5563"/><circle cx="1228" cy="536" r="12" fill="#f8fafc"/><circle cx="978" cy="536" r="21" fill="#fbbf24"/><text class="num" x="971" y="544">4</text>
</svg>
