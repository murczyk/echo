<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title-05 desc-05">
  <title id="title-05">Сповіщення Chrome у macOS</title><desc id="desc-05">Налаштування macOS для сповіщень Google Chrome.</desc>
  <style>.bg{fill:#1f1f1f}.side{fill:#25272b}.panel{fill:#2c2c2e}.h{font:700 36px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}.sub{font:400 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b8c0cc}.label{font:650 19px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}.small{font:500 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b8c0cc}.badge{fill:#93cdf6}.amber{fill:#d3871d}.num{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#000;text-anchor:middle}</style>
  <rect class="bg" width="1440" height="640"/><g id="header"><text class="h" x="64" y="76">Сповіщення Chrome у macOS</text><text class="sub" x="64" y="110">Системні параметри → Сповіщення → Google Chrome</text></g>
  <g id="settings-window"><rect class="panel" x="64" y="152" width="1312" height="426" rx="12"/><rect class="side" x="64" y="152" width="328" height="426" rx="12"/><circle cx="100" cy="182" r="7" fill="#dc2626"/><circle cx="124" cy="182" r="7" fill="#d3871d"/><circle cx="148" cy="182" r="7" fill="#16a34a"/><text class="small" x="96" y="234">Системні параметри</text><rect x="84" y="254" width="288" height="46" rx="8" fill="#2c6c91"/><text class="small" x="112" y="283" fill="#fff">Сповіщення</text><text class="small" x="112" y="348">Google Chrome</text><text class="small" x="112" y="404">Зосередження</text>
  <text class="label" x="440" y="208">Google Chrome</text><text class="small" x="440" y="238">Сповіщення</text><line x1="440" y1="266" x2="1336" y2="266" stroke="#5e5e64"/>
  <g id="controls"><circle class="badge" cx="476" cy="314" r="20"/><text class="num" x="476" y="320">1</text><text class="label" x="512" y="320">Дозволити сповіщення</text><rect x="1208" y="293" width="80" height="42" rx="21" fill="#2c6c91"/><circle cx="1267" cy="314" r="16" fill="#fff"/><line x1="440" y1="354" x2="1336" y2="354" stroke="#5e5e64"/>
  <circle class="badge" cx="476" cy="402" r="20"/><text class="num" x="476" y="408">2</text><text class="label" x="512" y="408">Стиль сповіщень</text><rect x="1052" y="380" width="236" height="44" rx="8" fill="#20252c" stroke="#5e5e64"/><text class="small" x="1074" y="408">Банери</text><path d="M1254 396l8 8 8-8" fill="none" stroke="#93cdf6" stroke-width="2" stroke-linecap="round"/><line x1="440" y1="442" x2="1336" y2="442" stroke="#5e5e64"/>
  <circle class="badge" cx="476" cy="490" r="20"/><text class="num" x="476" y="496">3</text><text class="label" x="512" y="496">Відтворювати звук для сповіщень</text><rect x="1208" y="469" width="80" height="42" rx="21" fill="#2c6c91"/><circle cx="1267" cy="490" r="16" fill="#fff"/>
  <circle class="amber" cx="850" cy="540" r="18"/><text class="num" x="850" y="546">4</text><text class="small" x="882" y="546">Режим «Зосередження» вимкнено</text><rect x="1208" y="519" width="80" height="42" rx="21" fill="#5e5e64"/><circle cx="1229" cy="540" r="16" fill="#fff"/></g></g>
</svg>
