<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title-05 desc-05">
  <title id="title-05">Налаштування сповіщень Chrome у macOS</title><desc id="desc-05">Абстрактна панель системних налаштувань показує вибраний Google Chrome, увімкнені сповіщення, банери, звуки та вимкнений Focus.</desc>
  <style>text{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h{font-size:34px;font-weight:700;fill:#f8fafc}.label{font-size:25px;font-weight:600;fill:#f8fafc}.sub{font-size:20px;fill:#b8bec8}.num{font-size:22px;font-weight:700;fill:#101216}</style>
  <rect width="1440" height="640" fill="#101216"/><text class="h" x="64" y="72">Сповіщення Chrome у macOS</text><text class="sub" x="64" y="108">Notifications → Google Chrome → Allow notifications</text>
  <rect x="64" y="148" width="1312" height="430" rx="18" fill="#181b21" stroke="#4b5563" stroke-width="2"/><rect x="64" y="148" width="360" height="430" rx="18" fill="#20252c"/><text class="label" x="104" y="208">System Settings</text><rect x="94" y="238" width="300" height="62" rx="12" fill="#181b21" stroke="#93c5fd" stroke-width="2"/><text class="sub" x="126" y="277">Notifications</text><rect x="94" y="322" width="300" height="62" rx="12" fill="#181b21" stroke="#4b5563" stroke-width="2"/><circle cx="126" cy="353" r="13" fill="#93c5fd"/><text class="sub" x="154" y="360">Google Chrome</text><text class="sub" x="126" y="446">Focus</text>
  <text class="label" x="480" y="208">Google Chrome</text><text class="sub" x="480" y="242">Notifications</text><rect x="480" y="270" width="830" height="2" fill="#4b5563"/><text class="label" x="480" y="328">Allow notifications</text><rect x="1200" y="294" width="82" height="42" rx="21" fill="#93c5fd"/><circle cx="1258" cy="315" r="16" fill="#101216"/><circle cx="450" cy="316" r="21" fill="#93c5fd"/><text class="num" x="443" y="324">1</text>
  <text class="label" x="480" y="404">Banner delivery</text><rect x="1096" y="370" width="186" height="54" rx="12" fill="#20252c" stroke="#93c5fd" stroke-width="3"/><text class="sub" x="1130" y="405" fill="#93c5fd">Banners</text><circle cx="450" cy="396" r="21" fill="#93c5fd"/><text class="num" x="443" y="404">2</text><text class="label" x="480" y="480">Notification sounds</text><rect x="1200" y="446" width="82" height="42" rx="21" fill="#93c5fd"/><circle cx="1258" cy="467" r="16" fill="#101216"/><circle cx="450" cy="468" r="21" fill="#93c5fd"/><text class="num" x="443" y="476">3</text>
  <rect x="984" y="512" width="326" height="48" rx="12" fill="#20252c" stroke="#4b5563" stroke-width="2"/><path d="M1014 528c15-18 29 0 14 14 15 14 1 32-14 14-15 18-29 0-14-14-15-14-1-32 14-14z" fill="none" stroke="#b8bec8" stroke-width="2"/><text class="sub" x="1050" y="544">Focus вимкнено</text><circle cx="954" cy="536" r="21" fill="#fbbf24"/><text class="num" x="947" y="544">4</text>
