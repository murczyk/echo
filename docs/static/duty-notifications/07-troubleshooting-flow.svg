<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title-07 desc-07">
  <title id="title-07">Схема діагностики сповіщень</title><desc id="desc-07">Дерево рішень показує перевірки каналу, тестів, системних налаштувань і відкритої сторінки з короткими діями для кожної невдачі.</desc>
  <style>text{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h{font-size:34px;font-weight:700;fill:#f8fafc}.node{font-size:25px;font-weight:600;fill:#f8fafc}.action{font-size:20px;font-weight:600;fill:#f8fafc}.small{font-size:20px;fill:#b8bec8}.num{font-size:22px;font-weight:700;fill:#101216}</style><defs><marker id="arrow-07" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#93c5fd"/></marker><marker id="red-07" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#f87171"/></marker><marker id="green-07" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#74c69d"/></marker></defs>
  <rect width="1440" height="640" fill="#101216"/><text class="h" x="64" y="72">Як знайти причину</text><text class="small" x="64" y="108">Йдіть синім шляхом «так». Червоні відгалуження підказують наступну дію.</text>
  <rect x="474" y="138" width="492" height="58" rx="14" fill="#20252c" stroke="#93c5fd" stroke-width="3"/><circle cx="506" cy="167" r="19" fill="#93c5fd"/><text class="num" x="500" y="175">1</text><text class="node" x="548" y="175">Перемикач увімкнено?</text><path d="M720 196v42" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow-07)"/><path d="M474 167H284" stroke="#f87171" stroke-width="3" marker-end="url(#red-07)"/><rect x="74" y="138" width="186" height="58" rx="14" fill="#20252c" stroke="#f87171" stroke-width="2"/><text class="action" x="96" y="174">Увімкнути канал</text>
  <rect x="414" y="244" width="612" height="58" rx="14" fill="#20252c" stroke="#fbbf24" stroke-width="3"/><circle cx="446" cy="273" r="19" fill="#fbbf24"/><text class="num" x="440" y="281">2</text><text class="node" x="488" y="281">Статус «Готово» / «Дозволено»?</text><path d="M720 302v42" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow-07)"/><path d="M1026 273h174" stroke="#f87171" stroke-width="3" marker-end="url(#red-07)"/><rect x="1210" y="244" width="166" height="58" rx="14" fill="#20252c" stroke="#f87171" stroke-width="2"/><text class="action" x="1224" y="268">Дозволити у</text><text class="action" x="1224" y="290">браузері</text>
  <rect x="474" y="350" width="492" height="58" rx="14" fill="#20252c" stroke="#fbbf24" stroke-width="3"/><circle cx="506" cy="379" r="19" fill="#fbbf24"/><text class="num" x="500" y="387">3</text><text class="node" x="548" y="387">Обидва тести працюють?</text><path d="M720 408v42" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow-07)"/><path d="M474 379H368" stroke="#f87171" stroke-width="3" marker-end="url(#red-07)"/><rect x="64" y="350" width="280" height="58" rx="14" fill="#20252c" stroke="#f87171" stroke-width="2"/><text class="action" x="88" y="386">Перевірити гучність</text>
  <rect x="370" y="456" width="700" height="58" rx="14" fill="#20252c" stroke="#fbbf24" stroke-width="3"/><circle cx="402" cy="485" r="19" fill="#fbbf24"/><text class="num" x="396" y="493">4</text><text class="node" x="444" y="493">Системні сповіщення і звук увімкнені?</text><path d="M720 514v30" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow-07)"/><path d="M1070 485h60" stroke="#f87171" stroke-width="3" marker-end="url(#red-07)"/><rect x="1150" y="456" width="226" height="58" rx="14" fill="#20252c" stroke="#f87171" stroke-width="2"/><text class="action" x="1170" y="480">Вимкнути Focus</text><text class="action" x="1170" y="502">/ Не турбувати</text>
  <rect x="474" y="550" width="492" height="58" rx="14" fill="#20252c" stroke="#93c5fd" stroke-width="3"/><circle cx="506" cy="579" r="19" fill="#93c5fd"/><text class="num" x="500" y="587">5</text><text class="node" x="548" y="587">«Оперативний» відкритий?</text><path d="M966 579h114" stroke="#74c69d" stroke-width="3" marker-end="url(#green-07)"/><rect x="1094" y="550" width="214" height="58" rx="14" fill="#20252c" stroke="#74c69d" stroke-width="3"/><text class="action" x="1120" y="586">Канал налаштовано</text><path d="M474 579H368" stroke="#f87171" stroke-width="3" marker-end="url(#red-07)"/><rect x="64" y="550" width="280" height="58" rx="14" fill="#20252c" stroke="#f87171" stroke-width="2"/><text class="action" x="88" y="586">Відкрити сторінку</text>
</svg>
