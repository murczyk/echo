<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title-07 desc-07">
  <title id="title-07">Як знайти причину</title><desc id="desc-07">Дерево рішень для діагностики каналу сповіщень.</desc>
  <style>.bg{fill:#1f1f1f}.node{fill:#2c2c2e}.action{fill:#20252c}.h{font:700 36px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}.sub{font:400 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b8c0cc}.label{font:650 17px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}.small{font:600 15px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b8c0cc}.badge{fill:#93cdf6}.num{font:700 17px Inter,ui-sans-serif,system-ui,sans-serif;fill:#000;text-anchor:middle}.yes{fill:none;stroke:#93cdf6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.no{fill:none;stroke:#dc2626;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style>
  <defs><marker id="arrow-yes-07" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1l5 3-5 3" fill="none" stroke="#93cdf6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-no-07" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1l5 3-5 3" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect class="bg" width="1440" height="640"/><g id="header"><text class="h" x="64" y="76">Як знайти причину</text><text class="sub" x="64" y="110">Рухайтеся синім шляхом, якщо відповідь «так». Червоні гілки показують, що потрібно виправити.</text></g>
  <g id="connectors"><path class="yes" d="M720 201v32" marker-end="url(#arrow-yes-07)"/><text class="small" x="734" y="222" fill="#93cdf6">Так</text><path class="yes" d="M720 291v32" marker-end="url(#arrow-yes-07)"/><text class="small" x="734" y="312" fill="#93cdf6">Так</text><path class="yes" d="M720 381v32" marker-end="url(#arrow-yes-07)"/><text class="small" x="734" y="402" fill="#93cdf6">Так</text><path class="yes" d="M720 471v32" marker-end="url(#arrow-yes-07)"/><text class="small" x="734" y="492" fill="#93cdf6">Так</text><path class="yes" d="M720 561v30" marker-end="url(#arrow-yes-07)"/><text class="small" x="734" y="582" fill="#93cdf6">Так</text>
  <path class="no" d="M530 173H436v0H414" marker-end="url(#arrow-no-07)"/><text class="small" x="465" y="165" fill="#ff9ba0">Ні</text><path class="no" d="M910 263h94" marker-end="url(#arrow-no-07)"/><text class="small" x="956" y="255" fill="#ff9ba0">Ні</text><path class="no" d="M530 353H436v0H414" marker-end="url(#arrow-no-07)"/><text class="small" x="465" y="345" fill="#ff9ba0">Ні</text><path class="no" d="M910 443h94" marker-end="url(#arrow-no-07)"/><text class="small" x="956" y="435" fill="#ff9ba0">Ні</text><path class="no" d="M530 533H436v0H414" marker-end="url(#arrow-no-07)"/><text class="small" x="465" y="525" fill="#ff9ba0">Ні</text></g>
  <g id="actions"><rect class="action" x="64" y="145" width="330" height="56" rx="8"/><text class="label" x="229" y="179" text-anchor="middle">Увімкнути канал</text><rect class="action" x="1046" y="235" width="330" height="56" rx="8"/><text class="label" x="1211" y="269" text-anchor="middle">Дозволити у браузері</text><rect class="action" x="64" y="325" width="330" height="56" rx="8"/><text class="label" x="229" y="359" text-anchor="middle">Перевірити гучність</text><rect class="action" x="1046" y="415" width="330" height="56" rx="8"/><text class="label" x="1211" y="441" text-anchor="middle">Вимкнути «Зосередження»</text><text class="small" x="1211" y="460" text-anchor="middle">або «Не турбувати»</text><rect class="action" x="64" y="505" width="330" height="56" rx="8"/><text class="label" x="229" y="539" text-anchor="middle">Відкрити сторінку</text></g>
  <g id="decisions"><g id="decision-1"><rect class="node" x="530" y="145" width="380" height="56" rx="8" stroke="#5e5e64"/><circle class="badge" cx="558" cy="173" r="17"/><text class="num" x="558" y="179">1</text><text class="label" x="590" y="179">Перемикач увімкнено?</text></g><g id="decision-2"><rect class="node" x="530" y="235" width="380" height="56" rx="8" stroke="#5e5e64"/><circle class="badge" cx="558" cy="263" r="17"/><text class="num" x="558" y="269">2</text><text class="label" x="590" y="258">Статус — «Готово»</text><text class="small" x="590" y="278">або «Дозволено»?</text></g><g id="decision-3"><rect class="node" x="530" y="325" width="380" height="56" rx="8" stroke="#5e5e64"/><circle class="badge" cx="558" cy="353" r="17"/><text class="num" x="558" y="359">3</text><text class="label" x="590" y="359">Обидва тести працюють?</text></g><g id="decision-4"><rect class="node" x="530" y="415" width="380" height="56" rx="8" stroke="#5e5e64"/><circle class="badge" cx="558" cy="443" r="17"/><text class="num" x="558" y="449">4</text><text class="label" x="590" y="438">Системні сповіщення та звук</text><text class="small" x="590" y="458">увімкнені?</text></g><g id="decision-5"><rect class="node" x="530" y="505" width="380" height="56" rx="8" stroke="#5e5e64"/><circle class="badge" cx="558" cy="533" r="17"/><text class="num" x="558" y="539">5</text><text class="label" x="590" y="539">Сторінку «Оперативний» відкрито?</text></g></g>
  <g id="success"><rect x="590" y="595" width="260" height="32" rx="16" fill="#16a34a"/><path d="M613 610l5 5 9-11" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="638" y="616" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="650" fill="#fff">Канал налаштовано</text></g>
</svg>
