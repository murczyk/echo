[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "milocr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fire>=0.7.1",
    "imagery24>=0.11.0",
    "ipykernel>=7.1.0",
    "ipython>=9.8.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.0",
    "matplotlib-inline>=0.2.1",
    "numpy>=2.3.5",
    "opencv-python>=4.11.0.86",
    "paddleocr[all]==3.3.2",
    "pillow>=11.1.0",
    "rasterio>=1.4.3",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
cpu = ["paddlepaddle==3.2.2"]
cu130 = ["paddlepaddle-gpu==3.2.2"]
cu129 = ["paddlepaddle-gpu==3.2.2"]
cu118 = ["paddlepaddle-gpu==3.2.2"]

[dependency-groups]
dev = ["pre-commit"]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu130" },
    { extra = "cu129" },
    { extra = "cu118" },
  ],
]

[tool.uv.sources]
paddlepaddle-gpu = [
  { index = "paddle-cu130", extra = "cu130" },
  { index = "paddle-cu129", extra = "cu129" },
  { index = "paddle-cu118", extra = "cu118" },
]

[[tool.uv.index]]
name = "paddle-cu130"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu130/"
explicit = true

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[[tool.uv.index]]
name = "paddle-cu118"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu118/"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["milocr"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff.lint]
select = ["I"]  # Enable isort rules
