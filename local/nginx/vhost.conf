server {
    server_name echo.localhost;

    listen 8080;
    listen [::]:8080;

    listen [::]:8443 ssl http2;
    listen 8443 ssl http2;
    ssl_certificate /etc/nginx/echo.localhost.crt;
    ssl_certificate_key /etc/nginx/echo.localhost.key;

    root /etc/nginx/public;
    index index.html;

    client_max_body_size 200M;
    proxy_read_timeout 600;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;

    location / {
        try_files $uri $uri/ /;
        add_header Cache-Control "no-cache";
    }
    location /src/ {
        include /etc/nginx/echo-dev-front-proxy.inc;
    }
    location /.elm-land/ {
        include /etc/nginx/echo-dev-front-proxy.inc;
    }
    location /@vite/ {
        include /etc/nginx/echo-dev-front-proxy.inc;
    }
    location /@id/ {
        include /etc/nginx/echo-dev-front-proxy.inc;
    }
    location /node_modules/.vite/ {
        include /etc/nginx/echo-dev-front-proxy.inc;
    }
    location /grafana {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
    }
    location ^~ /api/sigint/file-upload/ {
        client_max_body_size 6200M;
        proxy_request_buffering off;
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
    }
    location /api {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
    }
    location /api-public {
        proxy_pass http://localhost:8081/api-public;
        proxy_set_header Host $host;
    }
}
