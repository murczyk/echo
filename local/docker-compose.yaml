version: "3"
services:
  nginx:
    image: docker.io/nginxinc/nginx-unprivileged
    volumes:
      - ./nginx/vhost.conf:/etc/nginx/conf.d/default.conf
      - ./../deploy/echo.localhost.crt:/etc/nginx/echo.localhost.crt
      - ./../deploy/echo.localhost.key:/etc/nginx/echo.localhost.key
      - ./../wdintel-web/public:/etc/nginx/public
    network_mode: host
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    env_file: ./../.env
    volumes:
      - pgdata:/var/lib/postgresql
    network_mode: host
  grafana:
    image: "docker.io/grafana/grafana:latest"
    environment:
      GF_SERVER_ROOT_URL: "https://echo.localhost:8443/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_INSTALL_PLUGINS: "marcusolsson-json-datasource"
    user: "0"
    volumes:
      - grafana:/var/lib/grafana
    network_mode: host
volumes:
  pgdata:
  grafana:
