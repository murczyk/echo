api:
  enabled: true

sources:
  systemd:
    type: journald
    since_now: true
    # include_units:
    #   - wdintel-rs

transforms:
  parse_logs:
    type: remap
    inputs:
      - systemd
    source: |
      .

sinks:
  greptime:
    type: greptimedb_logs
    inputs:
      - parse_logs
    # GreptimeDB endpoint details
    endpoint: "http://echo-greptime.alpines-banded.ts.net:4000"
    dbname: "echo"
    table: "logs"
    pipeline_name: "greptime_identity"
    username: "${GREPTIME_USER}"
    password: "${GREPTIME_PASSWORD}"

  # stdout:
  #   type: console
  #   inputs:
  #     - parse_logs
  #   encoding:
  #     codec: json

