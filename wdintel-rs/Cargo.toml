[package]
name = "wdintel-rs"
version = "0.1.0"
edition = "2021"
authors = ["rickyrepel@gmail.com"]
license = "AllRightsReserved"
description = "ЕХО"

[dependencies]
echo-migration = { version = "*", path = "./migration" }
echo-install-utils = { git = "ssh://git@github.com/echoua/echo-install-utils.git", rev = "a041de10c7da99e7c791951c7a425d3937c11669" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.133"
quick-xml = { version = "0.37.5", features = ["serialize", "overlapped-lists"] }
actix-web = "4.11.0"
actix-files = "0.6.6"
actix-multipart = "0.7.2"
actix-identity = "0.8.0"
actix-session = { version = "0.10.1", features = ["redis-session", "redis-pool"] }
clap = { version = "4.5.38", features = ["derive"] }
dirs = "6.0.0"
elm_rs = "0.2.3"
log = "0.4.27"
thiserror = "2.0.12"
anyhow = "1.0.98"
uuid = { version = "1.11.0", features = ["v4", "v7"] }
chrono = "0.4.41"
chrono-tz = "0.10.3"
lazy_static = "1.5.0"
regex = { version = "1.11.1", features = ["pattern"] }
tempdir = "~0.3"
tempfile = "3.20.0"
walkdir = "^2.5.0"
zip = "3.0.0"
zip-extract = "0.2.3"
serial_test = "3.2.0"
aws-sdk-s3 = { version = "1.86.0", features = ["behavior-version-latest"] }
tokio = { version = "1.45.0" }
tokio-util = { version = "0.7.15", features = ["io"] }
nipper = "0.1"
futures-util = "0.3.30"
futures = "0.3.31"
fs_extra = "~1.3"
tl = "~0.7.8"
reqwest = { version = "^0.12.9", default-features = false, features = ["json", "multipart", "blocking", "rustls-tls"] }
csv = "1.3.1"
rust_xlsxwriter = "0.87.0"
# https://github.com/tafia/calamine/issues/498
calamine = "0.27.0"
# calamine = { git = "https://github.com/prophittcorey/calamine", rev = "2fc1a8df0d0519f352a4393660c54627c1e50cc2" }
sqlx = { version = "0.8.5", features = [
	"runtime-tokio-rustls",
	"macros",
	"postgres",
	"chrono",
	"json",
] }
rand = "0.9.1"
sha256 = "1.6.0"
sea-orm = { version = "1.1.11", features = [
	"debug-print",
	"runtime-tokio-rustls",
	"sqlx-postgres",
	"sea-orm-internal",
	"postgres-array",
] }
sea-orm-migration = "1.1.11"
base64 = "^0.22"
notify = "8.0.0"
env_logger = "0.11.8"
substring = "~1.4.5"
unicode-segmentation = "1.12.0"
indicatif = "0.17.9"
redis = { version = "0.31.0", features = ["tokio-comp", "connection-manager"] }
redis-macros = "0.5.3"
rust-argon2 = "^2.1.0"
bytes = "1.9.0"
docx-rs = "^0.4.17"
async-recursion = "^1.1.1"
toml = "0.8.22"
xshell = "0.2.7"
itertools = "0.14.0"
cached = { version = "0.55.1", features = ["async"] }
strsim = "0.11.1"
geoconvert = "1.0.2"
fxhash = "0.2.1"
levenshtein = "1.0.5"
pest = "2.7.14"
pest_derive = "2.7.14"
oauth2 = { version = "5.0.0-rc.1", features = ["reqwest-blocking"] }
ctor = "0.4.1"
urlencoding = "2.1.3"
url = "2.5.0"
syn = "2.0.101"
deadpool-postgres = { version = "0.14.1", default-features = false, features = [ "rt_tokio_1" ] }
tokio-postgres = { version = "0.7.13", default-features = false, features = [
	"with-chrono-0_4",
	"with-serde_json-1",
] }
time = "0.3.41"
deadpool-redis = { version = "0.20.0", features = ["json", "serde", "streams"] }
tokio-stream = "0.1.17"
cmd_lib = "1.9.5"
rustls = { version = "0.23.27", default-features = false, features = ["ring", "std", "logging", "tls12"] }
ssh2 = "0.9.5"
demoji = "0.0.3"
dialoguer = "0.11.0"

[dependencies.echo-im]
git = "ssh://git@github.com/echoua/echo-im.git"
rev = "e06eacf6f88140e1fda13681e3cf8fa07a2df05f"

[dependencies.milgeo-rs]
git = "ssh://git@github.com/echoua/milgeo-rs.git"
rev = "5f6cd460862dcf1965d341717e4358a52617fa3a"

[dependencies.opencv]
git = "https://github.com/twistedfall/opencv-rust"
rev = "e22fb2219954590022ff27f29fcdfc83fe44028f"
default-features = false
features = [
	"clang-runtime",
	"imgcodecs",
	"imgproc",
]
optional = true

[build-dependencies]
chrono = "0.4.41"

[features]
default = []
opencv = ["dep:opencv"]

[profile.dev]
debug-assertions = false

[package.metadata.deb]
maintainer-scripts = "debian/"
systemd-units = [
	{ unit-name = "wdintel-rs" },
	{ unit-name = "wdintel-rs-sigint-worker" },
	{ unit-name = "wdintel-py" },
	{ unit-name = "echo-signal-cli" },
	{ unit-name = "echo-whatsapp" },
	{ unit-name = "echo-vector" },
	{ unit-name = "echo-signal-bot@" },
	{ unit-name = "echo-whatsapp-bot@" },
]
depends = ""
assets = [
	[ "target/release/wdintel-rs", "usr/bin/", "755", ],
	[ "version.txt", "usr/share/echo/", "755", ],
	[ "../deploy/echo-whatsapp/echo-whatsapp", "usr/bin/", "755", ],
	[ "../deploy/empty.txt", "etc/echo/echo-whatsapp/", "755", ],
    [ "../deploy/greptimedb/vector.yaml", "etc/echo/vector.yaml", "755", ],
	[ "data/settlements.json", "etc/echo/", "755", ],
	[ "data/settlements_json/*", "etc/echo/settlements_json/", "755", ],
	[ "../deploy/empty.txt", "etc/echo/echo-whatsapp/storage/", "755", ],
	[ "../deploy/empty.txt", "/etc/echo/signal-cli-data/", "755", ],
	[ "../deploy/empty.txt", "/etc/echo/whatsapp-cli-data/", "755", ],
	[ "../deploy/echo_cron", "etc/cron.d/", "755", ],
	[ "wdintel-py/*", "usr/share/wdintel-py/", "755", ],
	[ "../wdintel-web/dist/*", "usr/share/echo/", "755", ],
	[ "../wdintel-web/dist/alchemy/*", "usr/share/echo/alchemy/", "755", ],
	[ "../wdintel-web/dist/d3-7.8.2/*", "usr/share/echo/d3-7.8.2/", "755", ],
	[ "../wdintel-web/dist/d3-force-3.0.0/*", "usr/share/echo/d3-force-3.0.0/", "755", ],
	[ "../wdintel-web/dist/assets/*", "usr/share/echo/assets/", "755", ],
	[ "../wdintel-web/dist/data/*", "usr/share/echo/data/", "755", ],
	[ "../wdintel-web/dist/*", "usr/share/echo/dist/", "755", ],
	[ "../wdintel-web/dist/img/*", "usr/share/echo/img/", "755", ],
	[ "../wdintel-web/dist/img/google_earth_icons/*", "usr/share/echo/img/google_earth_icons/", "755", ],
	[ "../wdintel-web/dist/netjsongraph/*", "usr/share/echo/netjsongraph/", "755", ],
	[ "migration/src/settlement_data.sql", "usr/share/echo/migration/settlement_data.sql", "755", ],
	[ "migration/src/settlement_data_rf.sql", "usr/share/echo/migration/settlement_data_rf.sql", "755", ],
	[ "migration/src/settlements_data_rf_rb.sql", "usr/share/echo/migration/settlements_data_rf_rb.sql", "755", ],
]
