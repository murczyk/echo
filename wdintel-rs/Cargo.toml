[package]
name = "wdintel-rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ЕХО"

[dependencies]
echo-migration = { version = "*", path = "../echo-migration" }
serde = { workspace = true }
serde_json = { workspace = true }
quick-xml = { version = "0.38.1", features = ["serialize", "overlapped-lists"] }
actix-web = { workspace = true }
actix-files = "0.6.6"
actix-multipart = "0.7.2"
actix-identity = "0.8.0"
actix-session = { version = "0.10.1", features = ["redis-session", "redis-pool"] }
clap = { version = "4.5.45", features = ["derive"] }
dirs = "6.0.0"
elm_rs = "=0.2.1"
log = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = "0.10.4"
lazy_static = "1.5.0"
once_cell = "1.19.0"
regex = { version = "1.11.1", features = ["pattern"] }
tempfile = "3.20.0"
walkdir = "^2.5.0"
zip = "4.3.0"
opendal = { version = "0.54", features = ["services-s3"] }
tokio = { workspace = true }
tokio-util = { version = "0.7.16", features = ["io"] }
nipper = "0.1"
futures-util = "0.3.31"
futures = "0.3.31"
fs_extra = "~1.3"
fs2 = "0.4.3"
tl = "~0.7.8"
reqwest = { version = "^0.12.23", default-features = false, features = ["json", "multipart", "blocking", "rustls-tls"] }
csv = "1.3.1"
rust_xlsxwriter = "0.90.0"
# https://github.com/tafia/calamine/issues/498
calamine = "0.30.0"
# calamine = { git = "https://github.com/prophittcorey/calamine", rev = "2fc1a8df0d0519f352a4393660c54627c1e50cc2" }
sqlx = { workspace = true }
rand = "0.9.2"
sha256 = "1.6.0"
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
base64 = "^0.22"
notify = "8.2.0"
env_logger = "0.11.8"
substring = "~1.4.5"
unicode-segmentation = "1.12.0"
indicatif = "0.18.0"
redis = { version = "1.0.2", features = ["tokio-comp", "connection-manager"] }
rust-argon2 = "^3.0.0"
bytes = "1.10.1"
docx-rs = "^0.4.18"
async-recursion = "^1.1.1"
toml = "0.9.5"
xshell = "0.2.7"
itertools = "0.14.0"
cached = { version = "0.56.0", features = ["async"] }
strsim = "0.11.1"
geoconvert = "1.0.2"
fxhash = "0.2.1"
levenshtein = "1.0.5"
strong-box = "0.5"
infer = "0.16.0"
mime_guess = "2.0.5"
pest = "2.8.1"
pest_derive = "2.8.1"
oauth2 = { version = "5.0.0", features = ["reqwest-blocking"] }
ctor = "0.5.0"
urlencoding = "2.1.3"
url = "2.5.4"
syn = { workspace = true }
deadpool-postgres = { version = "0.14.1", default-features = false, features = [ "rt_tokio_1" ] }
tokio-postgres = { version = "0.7.13", default-features = false, features = [
	"with-chrono-0_4",
	"with-serde_json-1",
] }
time = "0.3.41"
deadpool-redis = { version = "0.22.0", features = ["json", "serde", "streams"] }
tokio-stream = "0.1.17"
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "logging", "tls12"] }
ssh2 = "0.9.5"
demoji = "0.0.3"
dialoguer = "0.11.0"
ratatui = { version = "0.27.0", default-features = false, features = ["crossterm"] }
crossterm = "0.27.0"
tracing-subscriber = { version = "0.3.19", features = ["tracing-log"] }
unicode-normalization = "0.1.24"
content_disposition = "0.4.0"

[dev-dependencies]
random_word = { version = "0.5.0", features = ["en"] }
serial_test = "3.2.0"

[dependencies.echo-install-utils]
git = "ssh://git@github.com/echoua/echo-install-utils.git"
rev = "bb5c826c880050a371c8479aadf3e3a979880aca"

[dependencies.echo-im]
git = "ssh://git@github.com/echoua/echo-im.git"
rev = "345bc1b171aaf334ae8412e4a9c4dab3e3922fd6"

[dependencies.milgeo-rs]
git = "ssh://git@github.com/echoua/milgeo-rs.git"
rev = "b4dc3debf83eee1c62ccf4440951a45c2bef4c3c"

[dependencies.opencv]
git = "https://github.com/twistedfall/opencv-rust"
rev = "e22fb2219954590022ff27f29fcdfc83fe44028f"
default-features = false
features = [
	"clang-runtime",
	"imgcodecs",
	"imgproc",
]
optional = true

[build-dependencies]
chrono = { workspace = true }

[features]
default = ["proj"]
opencv = ["dep:opencv"]
proj = ["milgeo-rs/proj"]



[package.metadata.deb]
maintainer-scripts = "debian/"
systemd-units = [
	{ unit-name = "wdintel-rs" },
	{ unit-name = "wdintel-py" },
	# legacy mechanism without echo-im, to be discontinued
	{ unit-name = "echo-signal-cli" },
	{ unit-name = "echo-whatsapp" },
	{ unit-name = "echo-vector" },
	# new mechanism via echo-im
	{ unit-name = "echo-signal-bot@" },
	# new mechanism via echo-im
	{ unit-name = "echo-whatsapp-bot@" },
]
depends = ""
assets = [
	[ "target/release/wdintel-rs", "usr/bin/", "755", ],
	[ "version.txt", "usr/share/echo/", "755", ],
	[ "../deploy/echo-whatsapp/echo-whatsapp", "usr/bin/", "755", ],
	[ "../deploy/empty.txt", "etc/echo/echo-whatsapp/", "755", ],
    [ "../deploy/greptimedb/vector.yaml", "etc/echo/vector.yaml", "755", ],
	[ "data/callsigns_whitelist.txt", "etc/echo/", "755", ],
	[ "data/settlements.json", "etc/echo/", "755", ],
	[ "data/settlements_json/*", "etc/echo/settlements_json/", "755", ],
	[ "../deploy/empty.txt", "etc/echo/echo-whatsapp/storage/", "755", ],
	[ "../deploy/empty.txt", "/etc/echo/signal-cli-data/", "755", ],
	[ "../deploy/empty.txt", "/etc/echo/whatsapp-cli-data/", "755", ],
	[ "../deploy/echo_cron", "etc/cron.d/", "755", ],
	[ "wdintel-py/*", "usr/share/wdintel-py/", "755", ],
	[ "../wdintel-web/dist/*", "usr/share/echo/", "755", ],
	[ "../wdintel-web/dist/alchemy/*", "usr/share/echo/alchemy/", "755", ],
	[ "../wdintel-web/dist/d3-7.8.2/*", "usr/share/echo/d3-7.8.2/", "755", ],
	[ "../wdintel-web/dist/d3-force-3.0.0/*", "usr/share/echo/d3-force-3.0.0/", "755", ],
	[ "../wdintel-web/dist/assets/*", "usr/share/echo/assets/", "755", ],
	[ "../wdintel-web/dist/data/*", "usr/share/echo/data/", "755", ],
	[ "../wdintel-web/dist/*", "usr/share/echo/dist/", "755", ],
	[ "../wdintel-web/dist/img/*", "usr/share/echo/img/", "755", ],
	[ "../wdintel-web/dist/img/google_earth_icons/*", "usr/share/echo/img/google_earth_icons/", "755", ],
	[ "../wdintel-web/dist/netjsongraph/*", "usr/share/echo/netjsongraph/", "755", ],
	[ "../echo-migration/src/settlement_data.sql", "usr/share/echo/migration/settlement_data.sql", "755", ],
	[ "../echo-migration/src/settlement_data_rf.sql", "usr/share/echo/migration/settlement_data_rf.sql", "755", ],
	[ "../echo-migration/src/settlements_data_rf_rb.sql", "usr/share/echo/migration/settlements_data_rf_rb.sql", "755", ],
]
