[package]
name = "wdintel-rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ЕХО"

[dependencies]
echo-migration = { version = "*", path = "../echo-migration" }
wdfiles-migration = { version = "*", path = "../wdfiles-migration" }
serde = { workspace = true }
serde_ignored = "0.1.14"
serde_json = { workspace = true }
postcard = { workspace = true }
zstd = { workspace = true }
quick-xml = { version = "0.38.4", features = ["serialize", "overlapped-lists"] }
actix-web = { workspace = true }
goi-echo-worker = { path = "../goi-echo-worker" }
actix-files = "0.6.10"
actix-multipart = "0.7.2"
actix-identity = "0.8.0"
actix-session = { version = "0.10.1", features = ["redis-session", "redis-pool"] }
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
elm_rs = "=0.2.1"
log = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = "0.10.4"
lazy_static = "1.5.0"
once_cell = "1.21.4"
regex = "1.12.3"
pulldown-cmark = "0.13.0"
tempfile = "3.27.0"
walkdir = "^2.5.0"
zip = "4.6.1"
opendal = { version = "0.54", features = ["services-s3", "services-fs"] }
arrow-array = "59.1.0"
arrow-schema = "59.1.0"
parquet = { version = "59.1.0", features = ["arrow"] }
tokio = { workspace = true }
tokio-util = { version = "0.7.18", features = ["codec", "io"] }
nipper = "0.1"
ammonia = "4.1.2"
futures-util = "0.3.32"
futures = "0.3.32"
fs_extra = "~1.3"
fs2 = "0.4.3"
libc = "0.2"
tl = "~0.7.8"
reqwest = { version = "^0.12.28", default-features = false, features = ["json", "multipart", "blocking", "rustls-tls", "stream", "gzip"] }
csv = "1.4.0"
rust_xlsxwriter = "0.90.2"
# https://github.com/tafia/calamine/issues/498
calamine = "0.30.1"
# calamine = { git = "https://github.com/prophittcorey/calamine", rev = "2fc1a8df0d0519f352a4393660c54627c1e50cc2" }
sqlx = { workspace = true }
rand = "0.9.2"
sha256 = "1.6.0"
hmac = "0.12.1"
sha2 = "0.10.9"
md-5 = "0.10.6"
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
base64 = "^0.22"
notify = "8.2.0"
env_logger = "0.11.9"
substring = "~1.4.5"
unicode-segmentation = "1.12.0"
indicatif = "0.18.4"
iggy = "=0.10.3-edge.3"
redis = { version = "1.0.5", features = ["tokio-comp", "connection-manager"] }
rust-argon2 = "^3.0.0"
totp-rs = { version = "5.7", features = ["otpauth", "qr", "gen_secret"] }
bytes = "1.11.1"
docx-rs = "^0.4.19"
async-recursion = "^1.1.1"
async-trait = "0.1.89"
toml = "0.9.12"
xshell = "0.2.7"
itertools = "0.14.0"
cached = { version = "0.56.0", features = ["async"] }
strsim = "0.11.1"
geoconvert = "1.0.2"
fxhash = "0.2.1"
levenshtein = "1.0.5"
similar = "2.7.0"
strong-box = "0.5"
infer = "0.16.0"
mime_guess = "2.0.5"
pest = "2.8.6"
pest_derive = "2.8.6"
oauth2 = { version = "5.0.0", features = ["reqwest-blocking"] }
ctor = "0.5.0"
urlencoding = "2.1.3"
url = "2.5.8"
syn = { workspace = true }
deadpool-postgres = { version = "0.14.1", default-features = false, features = [ "rt_tokio_1" ] }
tokio-postgres = { version = "0.7.16", default-features = false, features = [
	"with-chrono-0_4",
	"with-serde_json-1",
] }
time = "0.3.47"
deadpool-redis = { version = "0.22.1", features = ["json", "serde", "streams"] }
tokio-stream = "0.1.18"
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "logging", "tls12"] }
ssh2 = "0.9.5"
demoji = "0.0.3"
dialoguer = "0.11.0"
ratatui = { version = "0.27.0", default-features = false, features = ["crossterm"] }
crossterm = "0.27.0"
tracing-subscriber = { version = "0.3.23", features = ["tracing-log"] }
unicode-normalization = "0.1.25"
opentelemetry = { version = "0.30.0", default-features = false, features = ["metrics"] }
opentelemetry-otlp = { version = "0.30.0", default-features = false, features = ["grpc-tonic", "internal-logs", "metrics"] }
opentelemetry_sdk = { version = "0.30.0", default-features = false, features = ["internal-logs", "metrics", "rt-tokio", "spec_unstable_metrics_views"] }
content_disposition = "0.4.0"

[dev-dependencies]
random_word = { version = "0.5.2", features = ["en"] }
serial_test = "3.4.0"

[dependencies.echo-install-utils]
git = "ssh://git@github.com/echoua/echo-install-utils.git"
rev = "c9efd65ccf72bf447867e5f959eec7779771007e"

[dependencies.echo-im]
git = "ssh://git@github.com/echoua/echo-im.git"
rev = "9e3154fa3d0c318d0ec48513c16b1f37105ef33c"

[dependencies.echo-gpu-client]
git = "ssh://git@github.com/echoua/echo-gpu.git"
rev = "44990c61563f7232697cac4aeffd5294ef37e720"

[dependencies.milgeo-rs]
git = "ssh://git@github.com/echoua/milgeo-rs.git"
rev = "a94bda974c1af3f31362c10965dda066c602cf30"

[dependencies.milgeo-audio-wave]
git = "ssh://git@github.com/echoua/milgeo-rs.git"
rev = "a94bda974c1af3f31362c10965dda066c602cf30"

[dependencies.opencv]
git = "https://github.com/twistedfall/opencv-rust"
rev = "e22fb2219954590022ff27f29fcdfc83fe44028f"
default-features = false
features = [
	"clang-runtime",
	"imgcodecs",
	"imgproc",
]
optional = true

[build-dependencies]
chrono = { workspace = true }

[features]
default = ["proj"]
opencv = ["dep:opencv"]
proj = ["milgeo-rs/proj"]


[package.metadata.deb]
maintainer-scripts = "debian/"
systemd-units = [
	{ unit-name = "wdintel-rs" },
	{ unit-name = "wdintel-rs-bgworker" },
	{ unit-name = "wdintel-rs-report-worker" },
	{ unit-name = "wdintel-py" },
	{ unit-name = "echo-vector" },
	{ unit-name = "echo-signal-bot@" },
	{ unit-name = "echo-whatsapp-bot@" },
]
depends = ""
replaces = "echo-docs"
assets = [
	[ "target/release/wdintel-rs", "usr/bin/", "755", ],
	[ "version.txt", "usr/share/echo/", "755", ],
	[ "../deploy/signoz/vector.yaml", "etc/echo/vector.yaml", "755", ],
	[ "data/callsigns_whitelist.txt", "etc/echo/", "755", ],
	[ "data/settlements.json", "etc/echo/", "755", ],
	[ "data/settlements_json/*", "etc/echo/settlements_json/", "755", ],
	[ "../deploy/empty.txt", "/etc/echo/signal-cli-data/", "755", ],
	[ "../deploy/empty.txt", "/etc/echo/whatsapp-cli-data/", "755", ],
	[ "../deploy/echo_cron", "etc/cron.d/", "755", ],
	[ "wdintel-py/*", "usr/share/wdintel-py/", "755", ],
	[ "../wdintel-web/dist/*", "usr/share/echo/", "755", ],
	[ "../wdintel-web/dist/alchemy/*", "usr/share/echo/alchemy/", "755", ],
	[ "../wdintel-web/dist/d3-7.8.2/*", "usr/share/echo/d3-7.8.2/", "755", ],
	[ "../wdintel-web/dist/d3-force-3.0.0/*", "usr/share/echo/d3-force-3.0.0/", "755", ],
	[ "../wdintel-web/dist/assets/*", "usr/share/echo/assets/", "755", ],
	[ "../wdintel-web/dist/data/*", "usr/share/echo/data/", "755", ],
	[ "../wdintel-web/dist/releases/**/*", "usr/share/echo/releases/", "755", ],
	[ "../wdintel-web/dist/*", "usr/share/echo/dist/", "755", ],
	[ "../wdintel-web/dist/img/*", "usr/share/echo/img/", "755", ],
	[ "../wdintel-web/dist/img/google_earth_icons/*", "usr/share/echo/img/google_earth_icons/", "755", ],
	[ "../wdintel-web/dist/netjsongraph/*", "usr/share/echo/netjsongraph/", "755", ],
	[ "../echo-migration/src/settlement_data.sql", "usr/share/echo/migration/settlement_data.sql", "755", ],
	[ "../echo-migration/src/settlement_data_rf.sql", "usr/share/echo/migration/settlement_data_rf.sql", "755", ],
	[ "../echo-migration/src/settlements_data_rf_rb.sql", "usr/share/echo/migration/settlements_data_rf_rb.sql", "755", ],
	[ "../deploy/clickhouse/bin/*", "usr/share/echo/analytics-control/bin/", "755", ],
	[ "../deploy/clickhouse/env/tables-exclude.txt", "usr/share/echo/analytics-control/env/tables-exclude.txt", "644", ],
	[ "../deploy/clickhouse/source-systemd/*", "usr/share/echo/analytics-control/source-systemd/", "644", ],
	[ "../deploy/clickhouse/systemd/*", "usr/share/echo/analytics-control/systemd/", "644", ],
	[ "../deploy/clickhouse/shims/*", "usr/share/echo/analytics-control/shims/", "755", ],
	[ "../deploy/clickhouse/control-protocol-version", "usr/share/echo/analytics-control/control-protocol-version", "644", ],
	[ "../deploy/clickhouse/migration-impact.json", "usr/share/echo/analytics-control/migration-impact.json", "644", ],
	[ "../deploy/clickhouse/versions.env", "usr/share/echo/analytics-control/versions.env", "644", ],
	[ "../deploy/clickhouse/shims/*", "opt/echo-peerdb/bin/", "755", ],
]
