[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echo-document-extractor"
version = "0.1.0"
description = "Deterministic semantic document extraction ensemble"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "openpyxl>=3.1,<4",
  "paddleocr[doc-parser]==3.7.0",
  "Pillow>=10,<12",
  "prometheus-client>=0.22,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "pypdfium2>=4.30,<5",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
cpu = ["paddlepaddle==3.3.1"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.12,<1"]
gpu = ["paddlepaddle-gpu==3.3.1"]

[project.scripts]
echo-doc = "echo_document_extractor.cli:app"
echo-doc-api = "echo_document_extractor.runtime:api"
echo-doc-worker = "echo_document_extractor.runtime:worker"

[tool.hatch.build.targets.wheel]
packages = ["src/echo_document_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: requires private fixtures, Paddle models, and configured inference endpoints"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP040", "UP042"]

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[[tool.uv.index]]
name = "paddle-gpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
paddlepaddle = { index = "paddle-cpu" }
paddlepaddle-gpu = { index = "paddle-gpu" }
