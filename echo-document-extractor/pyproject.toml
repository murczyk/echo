[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echo-document-extractor"
version = "0.1.0"
description = "Deterministic semantic document extraction ensemble"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "openpyxl>=3.1,<4",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10,<12",
  "pydantic>=2.8,<3",
  "pypdfium2>=4.30,<5",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
paddle = ["paddleocr>=3,<4"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.12,<1"]

[project.scripts]
echo-doc = "echo_document_extractor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/echo_document_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: requires private fixtures, Paddle models, and configured inference endpoints"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
