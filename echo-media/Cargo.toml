[package]
name = "echo-media"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true

[dependencies]
anyhow = { workspace = true }
libc = "0.2"
log = { workspace = true }
rustix = { version = "1.1.4", features = ["process", "thread"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3.27.0"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
rustix = { version = "1.1.4", features = ["fs", "mount"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync"] }
