receivers:
  prometheus/router:
    config:
      scrape_configs:
        - job_name: echo-vllm-router
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:ROUTER_METRICS_TARGET}"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "vllm_router_.*"
              action: keep

  prometheus/worker:
    config:
      scrape_configs:
        - job_name: echo-vllm-worker
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["${env:WORKER_METRICS_TARGET}"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "vllm:.*"
              action: keep

  # Host-level metrics for ct-echo-vllm-router itself
  hostmetrics:
    collection_interval: 60s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      disk: {}
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
      load: {}
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      network: {}
      paging: {}
      system: {}

  journald:
    directory: /var/log/journal
    start_at: end
    storage: file_storage/journald

  # Workaround for the hostmetrics filesystem scraper reporting nothing on
  # this host (confirmed via extensive isolated testing: not sandboxing, not
  # permissions, not the read-only-mount concern - raw `stat -f /` succeeds
  # fine as this same user, but the scraper's own enumeration still yields
  # zero data points here even with hardening fully stripped and an explicit
  # include_mount_points filter forced). Small local exporter mirrors the
  # incus-state-exporter.py pattern used elsewhere in this environment.
  prometheus/diskspace:
    config:
      scrape_configs:
        - job_name: disk-space
          scrape_interval: 60s
          static_configs:
            - targets: ["127.0.0.1:9100"]

processors:
  resource/router:
    attributes:
      - key: service.name
        value: vllm-router
        action: upsert
      - key: service.instance.id
        value: ct-echo-vllm-router
        action: upsert
      - key: host.name
        value: ct-echo-vllm-router
        action: upsert
      - key: echo.vllm.role
        value: router
        action: upsert

  resource/worker:
    attributes:
      - key: service.name
        value: vllm-worker
        action: upsert
      - key: service.instance.id
        value: echo-gpu-spark
        action: upsert
      - key: host.name
        value: echo-gpu-spark
        action: upsert
      - key: echo.vllm.role
        value: worker
        action: upsert

  batch/router:
    timeout: 5s

  batch/worker:
    timeout: 5s

  resource/host:
    attributes:
      - key: host.name
        value: ct-echo-vllm-router
        action: upsert
      - key: service.name
        value: echo-vllm-router-host
        action: upsert

  batch/host:
    timeout: 10s

exporters:
  otlp_grpc/signoz:
    endpoint: "${env:OTLP_DESTINATION_ENDPOINT}"
    tls:
      insecure: true

extensions:
  file_storage/journald:
    directory: /var/lib/echo-vllm-router-otel/file_storage
    create_directory: true

service:
  telemetry:
    metrics:
      level: none

  extensions: [file_storage/journald]

  pipelines:
    metrics/router:
      receivers: [prometheus/router]
      processors: [resource/router, batch/router]
      exporters: [otlp_grpc/signoz]

    metrics/worker:
      receivers: [prometheus/worker]
      processors: [resource/worker, batch/worker]
      exporters: [otlp_grpc/signoz]

    metrics/host:
      receivers: [hostmetrics, prometheus/diskspace]
      processors: [resource/host, batch/host]
      exporters: [otlp_grpc/signoz]

    logs/host:
      receivers: [journald]
      processors: [resource/host, batch/host]
      exporters: [otlp_grpc/signoz]

