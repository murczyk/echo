receivers:
  prometheus/router_general:
    config:
      scrape_configs:
        - job_name: echo-vllm-router-general
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:OTEL_ROUTER_METRICS_TARGET_GENERAL}"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "vllm_router_.*"
              action: keep

  prometheus/worker_general:
    config:
      scrape_configs:
        - job_name: echo-vllm-worker-general
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["${env:OTEL_WORKER_METRICS_TARGET_GENERAL}"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "vllm:.*"
              action: keep

  prometheus/router_ocr_gemma:
    config:
      scrape_configs:
        - job_name: echo-vllm-router-ocr-gemma
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:OTEL_ROUTER_METRICS_TARGET_OCR_GEMMA}"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "vllm_router_.*"
              action: keep

  prometheus/worker_ocr_gemma:
    config:
      scrape_configs:
        - job_name: echo-vllm-worker-ocr-gemma
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["${env:OTEL_WORKER_METRICS_TARGET_OCR_GEMMA}"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "vllm:.*"
              action: keep

  prometheus/router_nuextract:
    config:
      scrape_configs:
        - job_name: echo-vllm-router-nuextract
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:OTEL_ROUTER_METRICS_TARGET_NUEXTRACT}"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "vllm_router_.*"
              action: keep

  prometheus/worker_nuextract:
    config:
      scrape_configs:
        - job_name: echo-vllm-worker-nuextract
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["${env:OTEL_WORKER_METRICS_TARGET_NUEXTRACT}"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "vllm:.*"
              action: keep

  hostmetrics:
    collection_interval: 60s
    scrapers:
      # CPU scraper omitted: Incus limits.cpu: N reassigns host IDs in
      # /proc/stat; hostmetrics ucal then fails forever on the missing
      # TimesStat. Load/memory remain; :9100 is the disk-space workaround.
      disk: {}
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
      load: {}
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      network: {}
      paging: {}
      system: {}

  journald:
    directory: /var/log/journal
    start_at: end
    storage: file_storage/journald

  # Workaround for the hostmetrics filesystem scraper reporting nothing on
  # this host. This local exporter mirrors the incus-state-exporter.py pattern
  # used elsewhere in this environment.
  prometheus/diskspace:
    config:
      scrape_configs:
        - job_name: disk-space
          scrape_interval: 60s
          static_configs:
            - targets: ["127.0.0.1:9100"]

processors:
  resource/router_general:
    attributes:
      - key: service.name
        value: vllm-router
        action: upsert
      - key: service.instance.id
        value: ct-echo-vllm-router
        action: upsert
      - key: host.name
        value: ct-echo-vllm-router
        action: upsert
      - key: echo.vllm.role
        value: router
        action: upsert
      - key: echo.vllm.pool
        value: general-gemma
        action: upsert
      - key: echo.vllm.router
        value: ct-echo-vllm-router
        action: upsert

  resource/worker_general:
    attributes:
      - key: service.name
        value: vllm-worker
        action: upsert
      - key: service.instance.id
        value: echo-gpu-spark
        action: upsert
      - key: host.name
        value: echo-gpu-spark
        action: upsert
      - key: echo.vllm.role
        value: worker
        action: upsert
      - key: echo.vllm.pool
        value: general-gemma
        action: upsert
      - key: echo.vllm.worker
        value: echo-gpu-spark
        action: upsert

  resource/router_ocr_gemma:
    attributes:
      - key: service.name
        value: vllm-router
        action: upsert
      - key: service.instance.id
        value: ct-echo-vllm-router/ocr-gemma
        action: upsert
      - key: host.name
        value: ct-echo-vllm-router
        action: upsert
      - key: echo.vllm.role
        value: router
        action: upsert
      - key: echo.vllm.pool
        value: ocr-gemma
        action: upsert
      - key: echo.vllm.router
        value: ct-echo-vllm-router
        action: upsert

  resource/worker_ocr_gemma:
    attributes:
      - key: service.name
        value: vllm-worker
        action: upsert
      - key: service.instance.id
        value: echo-gpu-spark-02
        action: upsert
      - key: host.name
        value: echo-gpu-spark-02
        action: upsert
      - key: echo.vllm.role
        value: worker
        action: upsert
      - key: echo.vllm.pool
        value: ocr-gemma
        action: upsert
      - key: echo.vllm.worker
        value: echo-gpu-spark-02
        action: upsert

  resource/router_nuextract:
    attributes:
      - key: service.name
        value: vllm-router
        action: upsert
      - key: service.instance.id
        value: ct-echo-vllm-router/nuextract
        action: upsert
      - key: host.name
        value: ct-echo-vllm-router
        action: upsert
      - key: echo.vllm.role
        value: router
        action: upsert
      - key: echo.vllm.pool
        value: nuextract
        action: upsert
      - key: echo.vllm.router
        value: ct-echo-vllm-router
        action: upsert

  resource/worker_nuextract:
    attributes:
      - key: service.name
        value: vllm-worker
        action: upsert
      - key: service.instance.id
        value: echo-nuextract3
        action: upsert
      - key: host.name
        value: echo-nuextract3
        action: upsert
      - key: echo.vllm.role
        value: worker
        action: upsert
      - key: echo.vllm.pool
        value: nuextract
        action: upsert
      - key: echo.vllm.worker
        value: echo-nuextract3
        action: upsert

  batch/router_general:
    timeout: 5s
  batch/worker_general:
    timeout: 5s
  batch/router_ocr_gemma:
    timeout: 5s
  batch/worker_ocr_gemma:
    timeout: 5s
  batch/router_nuextract:
    timeout: 5s
  batch/worker_nuextract:
    timeout: 5s

  resource/host:
    attributes:
      - key: host.name
        value: ct-echo-vllm-router
        action: upsert
      - key: service.name
        value: echo-vllm-router-host
        action: upsert

  batch/host:
    timeout: 10s

exporters:
  otlp_grpc/signoz:
    endpoint: "${env:OTLP_DESTINATION_ENDPOINT}"
    tls:
      insecure: true

extensions:
  file_storage/journald:
    directory: /var/lib/echo-vllm-router-otel/file_storage
    create_directory: true

service:
  telemetry:
    metrics:
      level: none

  extensions: [file_storage/journald]

  pipelines:
    metrics/router_general:
      receivers: [prometheus/router_general]
      processors: [resource/router_general, batch/router_general]
      exporters: [otlp_grpc/signoz]

    metrics/worker_general:
      receivers: [prometheus/worker_general]
      processors: [resource/worker_general, batch/worker_general]
      exporters: [otlp_grpc/signoz]

    metrics/router_ocr_gemma:
      receivers: [prometheus/router_ocr_gemma]
      processors: [resource/router_ocr_gemma, batch/router_ocr_gemma]
      exporters: [otlp_grpc/signoz]

    metrics/worker_ocr_gemma:
      receivers: [prometheus/worker_ocr_gemma]
      processors: [resource/worker_ocr_gemma, batch/worker_ocr_gemma]
      exporters: [otlp_grpc/signoz]

    metrics/router_nuextract:
      receivers: [prometheus/router_nuextract]
      processors: [resource/router_nuextract, batch/router_nuextract]
      exporters: [otlp_grpc/signoz]

    metrics/worker_nuextract:
      receivers: [prometheus/worker_nuextract]
      processors: [resource/worker_nuextract, batch/worker_nuextract]
      exporters: [otlp_grpc/signoz]

    metrics/host:
      receivers: [hostmetrics, prometheus/diskspace]
      processors: [resource/host, batch/host]
      exporters: [otlp_grpc/signoz]

    logs/host:
      receivers: [journald]
      processors: [resource/host, batch/host]
      exporters: [otlp_grpc/signoz]
