[workspace]
members = [
    "wdintel-rs",
    "echo-migration",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["rickyrepel@gmail.com"]
license = "AllRightsReserved"
description = "ЕХО - Root workspace"

[workspace.dependencies]
# Common dependencies that can be shared across workspace members
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.133"
tokio = { version = "1.45.0" }
anyhow = "1.0.98"
chrono = "0.4.41"
uuid = { version = "1.11.0", features = ["v4", "v7"] }
log = "0.4.27"
thiserror = "2.0.12"
actix-web = "4.11.0"
sqlx = { version = "0.8.5", features = [
    "runtime-tokio-rustls",
    "macros",
    "postgres",
    "chrono",
    "json",
] }
sea-orm = { version = "1.1.11", features = [
    "debug-print",
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "sea-orm-internal",
    "postgres-array",
] }
sea-orm-migration = { version = "1.1.11", features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
] }
async-std = { version = "1.13.1", features = ["attributes", "tokio1"] }

[profile.release]
debug-assertions = false
