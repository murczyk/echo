[workspace]
members = [
    "wdintel-rs",
    "echo-migration", "wdfiles-migration", "echo-install",
    "docs/echo-docs", "echo-ai", "echo-iggy", "goi-echo-worker",
    "echo-messengers",
]
resolver = "2"

[workspace.package]
version = "0.1.1-rc.202609021926"
edition = "2021"
authors = ["rickyrepel@gmail.com"]
license = "AllRightsReserved"
description = "ЕХО - Root workspace"

[workspace.dependencies]
# Common dependencies that can be shared across workspace members
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
postcard = { version = "1.1.3", features = ["use-std"] }
zstd = "0.13.3"
tokio = { version = "1.52.2", features = ["tracing"] }
anyhow = "1.0.102"
chrono = "0.4.44"
uuid = { version = "1.22.0", features = ["v4", "v7"] }
log = "0.4.29"
thiserror = "2.0.18"
actix-web = "4.13.0"
sqlx = { version = "=0.9.0", features = [
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "postgres",
    "chrono",
    "json",
] }
sea-orm = { version = "=2.0.1", features = [
    "debug-print",
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "sea-orm-internal",
    "postgres-array",
    "postgres-use-serial-pk",
] }
sea-orm-migration = { version = "=2.0.1", features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
] }
syn = "2.0.117"

[patch.crates-io]
sea-orm-macros = { git = "https://github.com/k-bx/sea-orm.git", rev = "ebb994894c6420e7c4831370d009b90a33790979" }

[profile.dev]
debug-assertions = true
debug = true
opt-level = 0

[profile.release]
debug-assertions = false
