[workspace]
members = [
    "wdintel-rs",
    "echo-migration", "echo-install",
    "docs/echo-docs", "echo-ai",
]
resolver = "2"

[workspace.package]
version = "0.1.1-rc.202602251002"
edition = "2021"
authors = ["rickyrepel@gmail.com"]
license = "AllRightsReserved"
description = "ЕХО - Root workspace"

[workspace.dependencies]
# Common dependencies that can be shared across workspace members
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
tokio = { version = "1.47.1", features = ["tracing"] }
anyhow = "1.0.100"
chrono = "0.4.41"
uuid = { version = "1.18.0", features = ["v4", "v7"] }
log = "0.4.27"
thiserror = "2.0.15"
actix-web = "4.11.0"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-rustls",
    "macros",
    "postgres",
    "chrono",
    "json",
] }
sea-orm = { version = "1.1.14", features = [
    "debug-print",
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "sea-orm-internal",
    "postgres-array",
] }
sea-orm-migration = { version = "1.1.14", features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
] }
syn = "2.0.106"

[patch.crates-io]
# Use forked sqlx with pool connection refused fix, backported to 0.8.6.
# Upstream PR: https://github.com/launchbadge/sqlx/pull/3929
# Original line for reference in [workspace.dependencies]:
#   sqlx = { version = "0.8.6", features = [
#       "runtime-tokio-rustls",
#       "macros",
#       "postgres",
#       "chrono",
#       "json",
#   ] }
sqlx = { git = "https://github.com/alkeryn/sqlx.git", rev = "4b21f0954c1d402583e8da455182867f803952da" }

[profile.dev]
debug = 0

[profile.release]
debug-assertions = false
